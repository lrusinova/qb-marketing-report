<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="robots" content="noindex,nofollow"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<title>QB Marketing — Marketing Dashboard H2 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
:root{
  /* ── QB Brand 2026 ── Eden · Lochinvar · Flamingo ── */
  --navy:#10503C;--navy2:#082521;
  --qb-dark:#041B0E;--qb-teal:#2C9382;--qb-teal2:#206B60;
  --orange:#F23E30;--orange-lt:rgba(242,62,48,.12);
  --blue:#0066D6;--blue-lt:#EBF3FF;
  --green:#14A558;--green-lt:#E6F7EE;
  --amber:#F59E0B;--amber-lt:#FEF3C7;
  --red:#E53935;--red-lt:#FFEBEE;
  --purple:#7C3AED;--purple-lt:#f3eeff;
  --teal:#0891B2;--emerald:#059669;
  --g50:#F8FAFC;--g100:#F1F5F9;--g200:#E2E8F0;
  --g300:#CBD5E1;--g400:#94A3B8;--g500:#64748B;
  --g600:#475569;--g700:#334155;--g900:#0F172A;
  --bg:#EEF4F1;
  --sh:0 1px 3px rgba(10,50,30,.07),0 4px 14px rgba(10,50,30,.05);
  --sh2:0 8px 32px rgba(10,50,30,.14),0 2px 8px rgba(10,50,30,.07);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--g900);font-size:14px;line-height:1.5;min-height:100vh}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer}

/* ── HEADER ─────────────────────────────────────────── */
.hdr{background:#fff;border-bottom:3px solid var(--navy);padding:0 28px;display:flex;align-items:center;gap:14px;height:60px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,40,85,.1)}
.qb-mark{width:36px;height:36px;position:relative;flex-shrink:0}
.qb-mark svg{width:36px;height:36px}
.hdr-t h1{font-size:15px;font-weight:800;color:var(--navy);letter-spacing:-.2px}
.hdr-t p{font-size:11px;color:var(--g400);margin-top:1px;font-weight:400}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.hbadge{background:var(--g100);border:1px solid var(--g200);border-radius:20px;padding:4px 12px;font-size:11px;color:var(--g600);display:flex;align-items:center;gap:5px;font-weight:500}
.hbadge.teal{background:rgba(0,166,143,.1);border-color:rgba(0,166,143,.3);color:var(--qb-teal);font-weight:700}
.live-dot{width:6px;height:6px;background:#22c55e;border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── TABS ───────────────────────────────────────────── */
.tbar{background:#fff;border-bottom:2px solid var(--g100);display:flex;padding:0 22px;position:sticky;top:60px;z-index:99;box-shadow:0 2px 10px rgba(10,50,30,.07)}
.tbtn{display:inline-flex;align-items:center;gap:7px;padding:17px 20px;font-size:12.5px;font-weight:600;color:var(--g400);border:none;background:none;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .15s;white-space:nowrap;letter-spacing:.1px}
.tbtn:hover{color:var(--navy);background:rgba(16,80,60,.04)}
.tbtn.on{color:var(--navy);border-bottom-color:var(--orange);font-weight:800}
.tbtn svg{opacity:.55;flex-shrink:0;transition:opacity .15s}
.tbtn:hover svg,.tbtn.on svg{opacity:1}
.pane{display:none;padding:28px;max-width:1520px;margin:0 auto}
.pane.on{display:block}

/* ── KPI STRIP ──────────────────────────────────────── */
.kpi-strip{display:flex;gap:0;background:#fff;border-radius:14px;border:1px solid var(--g200);box-shadow:var(--sh);margin-bottom:20px;overflow:hidden}
.kpi-cell{flex:1;padding:18px 22px;position:relative;text-align:left}
.kpi-cell+.kpi-cell::before{content:'';position:absolute;left:0;top:15%;height:70%;width:1px;background:var(--g200)}
.kpi-n{font-size:34px;font-weight:900;line-height:1;letter-spacing:-1.5px}
.kpi-l{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--g400);margin-top:5px}
.kpi-sub{font-size:11px;color:var(--g500);margin-top:3px;font-weight:500}

/* ── TIMELINE ───────────────────────────────────────── */
.tl-card{background:#fff;border-radius:12px;padding:16px 22px;box-shadow:var(--sh);margin-bottom:22px;border:1px solid var(--g200)}
.tl-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.tl-title{font-size:11px;font-weight:700;color:var(--g500);text-transform:uppercase;letter-spacing:.5px}
.tl-stat{font-size:12px;color:var(--g600);font-weight:600}
.tl-track{position:relative;height:10px;background:var(--g100);border-radius:5px;overflow:visible;margin-bottom:5px}
.tl-q2fill{position:absolute;left:0;height:100%;border-radius:5px 0 0 5px;background:linear-gradient(90deg,var(--green),#22c55e)}
.tl-q3{position:absolute;left:33.33%;height:100%;background:var(--blue);opacity:.25;width:33.33%}
.tl-q4{position:absolute;left:66.66%;height:100%;border-radius:0 5px 5px 0;background:var(--purple);opacity:.18;width:33.34%}
.tl-pin{position:absolute;top:-6px;width:20px;height:20px;background:var(--orange);border:3px solid #fff;border-radius:50%;transform:translateX(-50%);box-shadow:0 0 0 3px rgba(255,104,32,.22);z-index:2}
.tl-labels{display:flex;font-size:10px;color:var(--g400);font-weight:600;margin-top:3px}
.tl-ql{flex:1;text-align:center}

/* ── SECTION HEADER ─────────────────────────────────── */
.sec-hd{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.sec-hd h2{font-size:17px;font-weight:900;color:var(--navy);padding-left:14px;letter-spacing:-.3px;border-left:4px solid var(--orange)}
.sec-hd p{font-size:12px;color:var(--g500);font-weight:500}

/* ── SP CARDS ───────────────────────────────────────── */
.sp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:24px;align-items:stretch}
.sp-card{background:#fff;border-radius:16px;box-shadow:0 2px 8px rgba(0,40,85,.08),0 8px 28px rgba(0,40,85,.1);overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .22s,transform .22s}
.sp-card:hover{box-shadow:0 6px 20px rgba(0,40,85,.16),0 20px 50px rgba(0,40,85,.12);transform:translateY(-3px)}
.sp-copy-btn{width:100%;padding:9px 18px;border:none;border-top:1px solid var(--g100);background:transparent;font-size:11px;font-weight:600;color:var(--g400);cursor:pointer;transition:all .15s;text-align:left;letter-spacing:.1px;border-radius:0 0 16px 16px;display:flex;align-items:center;gap:6px}
.sp-copy-btn:hover:not(:disabled){background:var(--g50);color:var(--navy)}
.sp-copy-btn:disabled{opacity:.55;cursor:wait}
#copy-toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:#0F172A;color:#fff;padding:10px 22px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;transition:all .22s;pointer-events:none;z-index:9000}
#copy-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sp-head{padding:15px 17px 12px}
.sp-top-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.sp-key-link{font-size:10px;font-family:'SF Mono','Fira Code',monospace;background:var(--g100);color:var(--g500);border-radius:6px;padding:2px 8px;font-weight:700;letter-spacing:.3px;text-decoration:none}
.sp-key-link:hover{background:var(--blue-lt);color:var(--blue);text-decoration:none}
.sp-title{font-size:14px;font-weight:900;color:var(--navy);line-height:1.2;margin-bottom:2px;letter-spacing:-.2px}
.sp-sub{font-size:11px;color:var(--g400);margin-bottom:7px}
.sp-owner{font-size:11px;color:var(--g600);display:flex;align-items:center;gap:4px}
.sp-owner.vacant{color:var(--amber);font-style:italic}
.sp-progress{padding:11px 17px;border-top:1px solid var(--g100);border-bottom:1px solid var(--g100)}
.sp-prow{display:flex;align-items:baseline;gap:9px;margin-bottom:8px}
.sp-pct{font-size:30px;font-weight:900;line-height:1;letter-spacing:-1px}
.sp-pdelta-up{font-size:11px;font-weight:700;color:var(--green)}
.sp-pdelta-dn{font-size:11px;font-weight:700;color:var(--red)}
.sp-pdelta-flat{font-size:11px;color:var(--g400)}
.sp-items-count{font-size:11px;color:var(--g400);margin-left:auto}
.sp-bar{height:7px;background:var(--g100);border-radius:4px;overflow:hidden}
.sp-fill{height:100%;border-radius:4px;transition:width .7s}
.sp-bar-lbl{font-size:9px;color:var(--g400);margin-top:5px;font-weight:500}
.sp-goals{padding:11px 17px;flex:1}
.sp-goals-lbl{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--g400);margin-bottom:8px}
.sp-goal{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px;font-size:11.5px;color:var(--g700);line-height:1.45}
.sp-gnum{width:17px;height:17px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:9px;font-weight:900;color:#fff;margin-top:1px}
.sp-p1s{padding:9px 17px 11px;border-top:1px solid var(--g100);background:var(--g50)}
.sp-p1-lbl{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--amber);margin-bottom:7px;display:flex;align-items:center;gap:5px}
.sp-p1-item{display:flex;align-items:center;gap:7px;margin-bottom:5px;font-size:11px;color:var(--g700);line-height:1.4}
.sp-p1-key{font-size:9px;font-family:'SF Mono','Fira Code',monospace;background:rgba(245,158,11,.1);color:#92400E;border-radius:5px;padding:2px 7px;font-weight:800;text-decoration:none;white-space:nowrap;flex-shrink:0}
.sp-p1-key:hover{background:rgba(245,158,11,.22);text-decoration:none}
.sp-p1-more{font-size:10px;color:var(--blue);margin-top:4px;font-weight:600}
.sp-note{padding:7px 17px;font-size:10.5px;color:#1E3A5F;background:#EFF6FF;border-top:1px solid #BFDBFE;display:flex;align-items:flex-start;gap:6px}
.sp-foot{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--g100);background:var(--g50);margin-top:auto}
.sp-fstat{padding:9px 6px;text-align:center;position:relative}
.sp-fstat+.sp-fstat::before{content:'';position:absolute;left:0;top:15%;height:70%;width:1px;background:var(--g200)}
.sp-fsn{font-size:16px;font-weight:900;line-height:1}
.sp-fsl{font-size:8px;text-transform:uppercase;letter-spacing:.6px;color:var(--g400);font-weight:700;display:block;margin-top:2px}
@media(max-width:1200px){.sp-grid{grid-template-columns:1fr 1fr}}
@media(max-width:900px){.sp-grid{grid-template-columns:1fr}}
.sp-ns-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:9px;padding-top:9px;border-top:1px solid rgba(255,255,255,.15)}
.sp-ns-chip{font-size:9px;font-weight:800;padding:2px 8px;border-radius:20px;letter-spacing:.4px;text-transform:uppercase}
.sp-mo-row{display:flex;flex-wrap:wrap;gap:4px;padding:10px 18px 6px;align-items:center;border-bottom:1px solid var(--g100)}
.sp-mo-tag{font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px;background:#f1f5f9;color:#64748b;border:1px solid #e2e8f0}
.sp-gc-embed{padding:8px 18px 6px;border-bottom:1px solid rgba(0,0,0,.06);border-top:1px solid rgba(0,0,0,.06)}
.sp-gc-item{display:flex;align-items:center;gap:6px;padding:3px 0;min-width:0}
.sp-gc-av{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:7.5px;font-weight:800;color:#fff;flex-shrink:0}
.sp-gc-name{font-size:11px;font-weight:700;color:var(--g800);white-space:nowrap;min-width:52px;flex-shrink:0}
.sp-gc-mocode{font-size:9px;color:var(--g400);font-weight:600;flex-shrink:0;min-width:38px}
.sp-gc-metric{flex:1;font-size:10.5px;color:var(--g600);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp-gc-metric strong{color:var(--g900);font-weight:700}
.sp-gc-sig{font-size:9px;font-weight:700;padding:1px 6px;border-radius:99px;white-space:nowrap;flex-shrink:0}
.sp-gc-sig.ok{background:#dcfce7;color:#15803d}.sp-gc-sig.watch{background:#fef3c7;color:#b45309}.sp-gc-sig.risk{background:#fee2e2;color:#dc2626}
.sp-exec-summary{font-size:12px;color:var(--g500);line-height:1.5;padding:10px 14px 4px;border-bottom:1px solid var(--g100);}
.sp-launches{padding:8px 14px 4px;border-bottom:1px solid var(--g100);}
.sp-launches-hdr{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--g300);margin-bottom:6px;}
.sp-bu-scope{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 2px;}
/* sp-card-hdr BU tags now inherit standard light-bg sp-bu-* styles — no overrides needed */
.sp-launch-chip{display:flex;align-items:center;gap:6px;padding:5px 6px;border-bottom:1px solid var(--g50);border-radius:5px;text-decoration:none;transition:background .14s;}
.sp-launch-chip:last-child{border-bottom:none;}
.sp-launch-chip:hover{background:var(--g50);text-decoration:none;}
.sp-launch-chip:hover .sp-lc-title{color:var(--navy);}
.sp-lc-key{font-size:8.5px;font-family:'SF Mono','Fira Code',monospace;font-weight:700;color:var(--g300);flex-shrink:0;letter-spacing:.4px;}
.sp-lc-bu{font-size:9px;font-weight:700;background:var(--g100);color:var(--g400);padding:1px 5px;border-radius:3px;flex-shrink:0;}
.sp-lc-title{font-size:11px;font-weight:600;color:var(--g600);flex:1;}
.sp-lc-due{font-size:10px;color:var(--g300);flex-shrink:0;}
.sp-lc-status{font-size:9px;font-weight:700;flex-shrink:0;}
.sp-goals-list{padding:6px 14px 8px;border-bottom:1px solid var(--g100);}
.sp-goal-item{display:flex;align-items:flex-start;gap:6px;font-size:11px;color:var(--g500);padding:2px 0;line-height:1.4;}
.sp-goal-dot{color:var(--g300);flex-shrink:0;margin-top:1px;}
/* NS strip */
.ns-strip{background:#fff;border-radius:16px;box-shadow:0 2px 8px rgba(0,40,85,.08),0 8px 28px rgba(0,40,85,.07);margin-bottom:20px;overflow:hidden}
.ns-strip-hdr{padding:13px 20px 11px;border-bottom:1px solid var(--g100);display:flex;align-items:center;justify-content:space-between}
.ns-strip-ttl{font-size:11px;font-weight:800;color:var(--g700);text-transform:uppercase;letter-spacing:.6px}
.ns-strip-src{font-size:10px;color:var(--g400)}
.ns-cards{display:grid;grid-template-columns:repeat(4,1fr)}
.ns-card{padding:18px 20px 16px;border-right:1px solid var(--g100);border-top:3px solid transparent;transition:border-top-color .15s}
.ns-card:last-child{border-right:none}
.ns-card-metric{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--g400);margin-bottom:5px}
.ns-card-kpi{font-size:22px;font-weight:800;letter-spacing:-.5px;line-height:1.05;margin-bottom:2px}
.ns-card-kpisub{font-size:9.5px;font-weight:500;color:var(--g400);margin-bottom:7px;line-height:1.35}
.ns-card-target{font-size:10px;color:var(--g300);font-style:italic;margin-top:4px;line-height:1.4}
.ns-mo-list{margin-top:10px;display:flex;flex-direction:column;gap:0}
.ns-mo-entry{padding:4px 0 2px;border-bottom:1px solid rgba(0,0,0,.05)}
.ns-mo-entry:last-child{border-bottom:none;padding-bottom:0}
.ns-mo-row{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:10px}
.ns-mo-desc{color:var(--g600);flex:1;line-height:1.35;display:flex;align-items:center;gap:5px;flex-wrap:wrap;min-width:0}
.ns-mo-code{font-size:8px;font-weight:900;padding:1px 5px;border-radius:3px;letter-spacing:.3px;flex-shrink:0;white-space:nowrap}
.ns-mo-name{font-size:10px;color:var(--g700);font-weight:600}
.ns-mo-owner{font-size:9px;color:var(--g400);font-style:italic;white-space:nowrap;flex-shrink:0}
.ns-mo-nums{display:flex;align-items:center;gap:4px;flex-shrink:0;white-space:nowrap}
.ns-mo-curr{font-weight:700;color:var(--g600)}
.ns-mo-arr{color:var(--g300);font-size:9px}
.ns-mo-tgt{font-weight:700;color:var(--g800)}
.ns-mo-bar{height:3px;background:rgba(0,0,0,.05);border-radius:2px;margin:3px 0 3px;overflow:hidden}
.ns-mo-bar-fill{height:3px;border-radius:2px;animation:spBarFill 1.2s cubic-bezier(.4,0,.2,1) both}
.ns-signal{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;padding:2px 9px;border-radius:20px;margin-bottom:8px}
.ns-signal.ok{background:#dcfce7;color:#15803d}
.ns-signal.watch{background:#fef3c7;color:#b45309}
.ns-signal.risk{background:#fee2e2;color:#dc2626}
.ns-card-mos{font-size:10px;color:var(--g500);line-height:1.5;font-weight:500}
.ns-kpi-bar{padding:8px 20px;background:#f8fafc;border-top:1px solid var(--g100);display:flex;align-items:center;flex-wrap:wrap}
.ns-kpi-chip{font-size:11px;font-weight:500;color:var(--g600);padding:3px 14px;border-right:1px solid var(--g200);white-space:nowrap;line-height:1.6}
.ns-kpi-chip:first-child{padding-left:0}
.ns-kpi-chip:last-child{border-right:none}
.ns-kpi-chip strong{color:var(--g900);font-weight:700}
.ns-kpi-chip.warn strong{color:#b45309}
.ns-kpi-chip.ok strong{color:#15803d}
/* exec summary on cards */
.sp-exec{font-size:11px;color:var(--g600);line-height:1.55;padding:10px 18px 10px;border-bottom:1px solid var(--g100);background:#fafafa}
/* Initiative header progress bar */
.sp-hdr-bar-wrap{height:4px;background:rgba(0,0,0,.06);overflow:hidden;margin:10px -18px -12px}
.sp-hdr-bar-fill{height:4px;will-change:width;animation:spBarFill 1.4s cubic-bezier(.4,0,.2,1) both}
@keyframes spBarFill{from{width:0}}
/* NS card — contributing initiative dots */
.ns-ini-row{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px solid rgba(0,0,0,.07)}
.ns-ini-dot{font-size:8.5px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap}
/* Initiative card — launches & recent tasks sections */
.sp-sec-hdr{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--g400);padding:7px 18px 5px;background:var(--g50);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--g100)}
.sp-launches2{}
.sp-launch2{display:flex;align-items:center;gap:7px;padding:6px 18px;border-bottom:1px solid var(--g50);font-size:11.5px;min-width:0}
.sp-launch2:last-child{border-bottom:none}
.sp-l2-title{flex:1;color:var(--g800);font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp-l2-due{font-size:10px;color:var(--g400);flex-shrink:0}
.sp-l2-status{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:10px;flex-shrink:0}
.sp-l2-key{font-size:9px;font-family:monospace;color:var(--g300);text-decoration:none;flex-shrink:0}
.sp-l2-key:hover{color:var(--blue)}
.sp-rt-wrap{padding:10px 18px 8px}
.sp-rt-group{margin-bottom:9px}
.sp-rt-group:last-child{margin-bottom:0}
.sp-rt-grp-hdr{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.sp-rt-grp-name{font-size:10px;font-weight:800;color:var(--g600);text-transform:uppercase;letter-spacing:.4px}
.sp-rt-grp-count{font-size:9px;font-weight:800;padding:1px 6px;border-radius:20px;background:var(--g100);color:var(--g500)}
.sp-rt-task{font-size:11px;color:var(--g600);padding:2px 0 2px 10px;border-left:2px solid var(--g200);margin-bottom:2px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.sp-rt-more{font-size:10px;color:var(--g400);padding:2px 0 2px 10px;font-style:italic}
.sp-mini-stats{display:flex;align-items:center;gap:6px;padding:6px 18px;background:var(--g50);border-bottom:1px solid var(--g100);flex-wrap:wrap}
.sp-ms-dn{font-size:10.5px;font-weight:700;color:#16a34a}

/* ── TEAMS DASHBOARD (one tailored widget per channel) ──────────── */

.tw-spot{background:linear-gradient(135deg,#0891B20d 0%,#fff 55%);border:1px solid #0891B233;border-top:4px solid #0891B2;border-radius:16px;padding:20px 22px;margin-bottom:18px;box-shadow:var(--sh)}

.tw-spot-title{font-size:16px;font-weight:900;color:var(--navy);display:flex;align-items:center;gap:9px}
.tw-spot-sub{font-size:11px;color:var(--g500);margin-top:3px}
.tw-spot-pulled{font-size:10px;font-weight:700;color:#0891B2;background:#0891B214;border:1px solid #0891B233;border-radius:20px;padding:4px 12px;white-space:nowrap}

@media(max-width:900px){.tw-spot-bu-row{grid-template-columns:1fr}}
.tw-spot-bu{background:#fff;border:1px solid var(--g200);border-radius:12px;padding:14px 16px}
.tw-spot-bu-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.tw-spot-bu-name{font-size:12.5px;font-weight:800;color:var(--navy);text-decoration:none}
a.tw-spot-bu-name{cursor:pointer}
a.tw-spot-bu-name:hover{text-decoration:underline}
.tw-spot-bu-total{font-size:10.5px;color:var(--g400)}
.tw-spot-lbl{font-size:9px;font-weight:800;color:var(--g400);text-transform:uppercase;letter-spacing:.4px;margin:8px 0 4px}
.tw-spot-mini-row{display:flex;gap:2px;height:9px;border-radius:5px;overflow:hidden;background:var(--g100);margin-bottom:5px}
.tw-spot-mini-seg{height:100%}
.tw-spot-mini-legend{font-size:9.5px;color:var(--g500);line-height:1.5}
.tw-spot-empty{font-size:10.5px;color:var(--g400);font-style:italic;padding:4px 0}
/* auto-fit + minmax: reliably 3 columns at this dashboard's ~1520px max-width, tapering down
   responsively — and a partial last row stretches to fill the width instead of sitting narrow. */
.tw-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:14px;align-items:stretch}
.tw-card-wide{grid-column:1/-1}
@keyframes twFadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.tw-card{background:#fff;border-radius:16px;box-shadow:var(--sh);border:1px solid var(--g200);border-top:4px solid var(--tw-accent,var(--g300));padding:17px 19px;display:flex;flex-direction:column;gap:11px;height:100%;transition:transform .16s ease,box-shadow .16s ease;animation:twFadeIn .45s ease both}
.tw-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(15,23,42,.1)}
.tw-card-hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tw-card-title{font-size:13.5px;font-weight:800;color:var(--navy);display:flex;align-items:center;gap:9px}
.tw-icon{font-size:14px;line-height:1;flex-shrink:0;width:26px;height:26px;border-radius:50%;background:color-mix(in srgb,var(--tw-accent,var(--g300)) 14%,white);display:inline-flex;align-items:center;justify-content:center}
.tw-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:none}
.tw-badge{font-size:9px;font-weight:800;padding:3px 9px;border-radius:10px;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;flex-shrink:0}
.tw-signal-lbl{font-size:10.5px;color:var(--g500);margin-top:auto;padding-top:6px}
/* Pipeline — Briefed → In progress → Published, the universal first block on every widget */
.tw-pipe-row{display:flex;align-items:center;gap:2px}
.tw-pipe-stage{flex:1;text-align:center;background:var(--g50);border-radius:12px;padding:10px 6px;transition:transform .15s ease,box-shadow .15s ease;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center}
a.tw-pipe-stage{cursor:pointer}
a.tw-pipe-stage:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(15,23,42,.1)}
.tw-pipe-icon{font-size:12px;line-height:1;margin-bottom:3px;opacity:.75}

/* Segmented strip — one hue, sequential (opacity-ranked), replaces per-type bar rows */

.tw-seg-chip{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:600;color:var(--g600);white-space:nowrap;background:var(--g50);border:1px solid var(--g100);border-radius:20px;padding:3px 9px 3px 7px;text-decoration:none;transition:background .12s ease,border-color .12s ease}

.tw-seg-chip-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* Meter — single ratio against a whole (e.g. SEO share of shared team capacity) */

/* insight callout */
.sp-insight{padding:9px 18px 10px;font-size:11px;line-height:1.55;display:flex;align-items:flex-start;gap:8px;border-top:1px solid var(--g100)}
.sp-insight-warn{background:rgba(245,158,11,.08);border-top-color:rgba(245,158,11,.2);color:#7C4A00}
.sp-insight-risk{background:rgba(229,57,53,.06);border-top-color:rgba(229,57,53,.15);color:#991B1B}
.sp-insight-ok{background:rgba(20,165,88,.06);border-top-color:rgba(20,165,88,.15);color:#166534}
.sp-i-icon{font-size:12px;flex-shrink:0;margin-top:1px}
/* status dots (small) */
.sp-status-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.sp-dot-ip{background:var(--green)}
.sp-dot-blk{background:var(--red)}
.sp-dot-plan{background:var(--g300)}

/* ── FANCY TIMELINE (tl2) ───────────────────────────── */
.tl2{background:#fff;border-radius:16px;padding:24px 28px 20px;box-shadow:0 2px 8px rgba(0,40,85,.08),0 8px 28px rgba(0,40,85,.1);border:1px solid var(--g200);margin-bottom:24px}
.tl2-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.tl2-hdtitle{font-size:12px;font-weight:800;color:var(--g400);text-transform:uppercase;letter-spacing:.7px}
.tl2-today-badge{font-size:12px;font-weight:700;color:var(--orange);background:rgba(255,104,32,.08);border:1px solid rgba(255,104,32,.2);border-radius:20px;padding:4px 14px}
/* tl2: kstats full-width */
.tl2-kstats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px}
.tl2-ks{padding:14px 10px;text-align:center;background:var(--g50);border-radius:12px;border:1px solid var(--g200)}
.tl2-ksn{display:block;font-size:30px;font-weight:900;line-height:1;letter-spacing:-1.5px;margin-bottom:5px}
.tl2-ksl{display:block;font-size:9px;font-weight:700;color:var(--g400);text-transform:uppercase;letter-spacing:.5px}
/* tl2 AI insight block */
.tl2-insight{display:flex;align-items:flex-start;gap:10px;background:rgba(0,40,85,.035);border:1px solid rgba(0,40,85,.09);border-radius:10px;padding:11px 14px;margin-bottom:20px}
.tl2-insight-icon{font-size:13px;flex-shrink:0;margin-top:1px}
.tl2-insight-txt{font-size:12px;font-weight:500;color:var(--g700);line-height:1.6}
.tl2-insight-txt strong{font-weight:800;color:var(--g900)}
.tl2-insight.is-risk{background:rgba(229,57,53,.05);border-color:rgba(229,57,53,.18);color:var(--g700)}
.tl2-insight.is-warn{background:rgba(245,158,11,.07);border-color:rgba(245,158,11,.22)}
.tl2-insight.is-ok{background:rgba(20,165,88,.05);border-color:rgba(20,165,88,.2)}
/* initiative ranked table */
.tl2-rank{margin-top:18px;padding-top:14px;border-top:1px solid var(--g100)}
.tl2-rank-lbl{font-size:8.5px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--g400);margin-bottom:10px;display:block}
.tl2-rank-row{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.tl2-rank-name{font-size:11px;font-weight:700;color:var(--g700);width:140px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl2-rank-bar-wrap{flex:1;height:7px;background:var(--g100);border-radius:4px;position:relative;overflow:visible}
.tl2-rank-bar-fill{height:100%;border-radius:4px;position:absolute;left:0;top:0;min-width:3px}
.tl2-rank-bar-pace{position:absolute;top:-4px;bottom:-4px;width:2px;background:rgba(20,165,88,.45);border-radius:1px;z-index:2}
.tl2-rank-tasks{font-size:10px;font-weight:700;width:70px;text-align:right;flex-shrink:0;white-space:nowrap}
.tl2-rank-delta{font-size:10px;font-weight:700;width:24px;text-align:center;flex-shrink:0}
.tl2-rank-badge{flex-shrink:0}
/* needs-attention strip */
.attn{background:#fff;border-radius:14px;border:1.5px solid rgba(245,158,11,.28);padding:14px 20px 12px;margin-bottom:20px;box-shadow:0 1px 8px rgba(245,158,11,.09)}
.attn-hd{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.attn-ttl{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.7px;color:#92400E}
.attn-cnt{font-size:10px;font-weight:800;color:#92400E;background:rgba(245,158,11,.15);border-radius:20px;padding:2px 9px}
.attn-list{display:flex;flex-direction:column;gap:6px}
.attn-row{display:flex;align-items:baseline;gap:9px;padding:7px 10px;border-radius:8px;background:var(--g50)}
.attn-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:4px;align-self:flex-start}
.attn-body{flex:1;font-size:12px;color:var(--g700);line-height:1.5}
.attn-nm{font-weight:800;color:var(--g900)}
.attn-open{font-size:10px;font-weight:700;color:var(--blue);text-decoration:none;white-space:nowrap;flex-shrink:0}
.attn-open:hover{text-decoration:underline}
/* recent wins strip */
.wins{margin-top:18px;padding-top:14px;border-top:1px solid var(--g100)}
.wins-lbl{font-size:8.5px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--g400);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.wins-lbl a{font-weight:600;color:var(--blue);text-decoration:none;letter-spacing:0;text-transform:none;font-size:10px}
.wins-lbl a:hover{text-decoration:underline}
.wins-scroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.wins-scroll::-webkit-scrollbar{display:none}
.win-card{flex:0 0 168px;background:var(--g50);border:1px solid var(--g200);border-left-width:3px;border-radius:10px;padding:10px 12px;text-decoration:none;display:block;transition:border-color .15s,background .15s}
.win-card:hover{border-color:var(--g300);background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.wins-stats{display:flex;gap:14px;padding:0 0 10px;flex-wrap:wrap}
.wins-stat{font-size:11.5px;color:var(--g500)}.wins-stat strong{color:var(--g800);font-weight:800}
/* ── Goal Cascade accountability table ── */
.gc-wrap{background:#fff;border-radius:16px;box-shadow:0 2px 8px rgba(0,40,85,.08),0 8px 28px rgba(0,40,85,.07);margin-bottom:20px;overflow:hidden}
.gc-hdr{padding:12px 20px 10px;border-bottom:1px solid var(--g100);display:flex;align-items:center;justify-content:space-between}
.gc-ttl{font-size:11px;font-weight:800;color:var(--g700);text-transform:uppercase;letter-spacing:.6px}
.gc-src{font-size:10px;color:var(--g400)}
.gc-row{display:grid;grid-template-columns:52px 8px 126px 155px 1fr 66px 72px;align-items:center;column-gap:9px;padding:8px 20px;border-bottom:1px solid var(--g100);transition:background .1s}
.gc-row:last-child{border-bottom:none}
.gc-row:hover{background:var(--g50)}
.gc-id{font-size:10px;font-weight:700;color:var(--g500);font-family:monospace}
.gc-ns-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;justify-self:center}
.gc-own{display:flex;align-items:center;gap:5px;min-width:0;overflow:hidden}
.gc-av{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;color:#fff;flex-shrink:0}
.gc-own-name{font-size:11.5px;font-weight:600;color:var(--g800);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.gc-mo{font-size:10px;font-weight:600;color:var(--g600);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc-mo-code{font-size:9px;opacity:.5;margin-right:3px}
.gc-prog{display:flex;align-items:center;gap:4px;font-size:11px;min-width:0;overflow:hidden}
.gc-curr{font-weight:700;color:var(--g600);white-space:nowrap}
.gc-sep{color:var(--g300)}
.gc-tgt{font-weight:800;color:var(--g900);white-space:nowrap}
.gc-qtr{font-size:9.5px;color:var(--g400);white-space:nowrap;text-align:center}
.gc-sig{display:inline-flex;align-items:center;font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:99px;justify-content:center;white-space:nowrap}
.gc-sig.ok{background:#dcfce7;color:#15803d}.gc-sig.watch{background:#fef3c7;color:#b45309}.gc-sig.risk{background:#fee2e2;color:#dc2626}
/* ── Next 30 days strip ── */
.nxt-wrap{background:#fff;border-radius:16px;box-shadow:0 2px 8px rgba(0,40,85,.08),0 8px 28px rgba(0,40,85,.07);margin-bottom:20px;overflow:hidden}
.nxt-hdr{padding:12px 20px 10px;border-bottom:1px solid var(--g100);display:flex;align-items:center;justify-content:space-between}
.nxt-ttl{font-size:11px;font-weight:800;color:var(--g700);text-transform:uppercase;letter-spacing:.6px}
.nxt-src{font-size:10px;color:var(--g400)}
.nxt-scroll{display:flex;gap:10px;overflow-x:auto;padding:14px 20px;scrollbar-width:none}
.nxt-scroll::-webkit-scrollbar{display:none}
.nxt-card{flex:0 0 auto;width:166px;background:var(--g50);border-radius:10px;border:1px solid var(--g200);padding:11px 13px;transition:all .12s}
.nxt-card:hover{border-color:#94a3b8;box-shadow:0 2px 8px rgba(0,0,0,.07);transform:translateY(-1px)}
.nxt-date{font-size:11px;font-weight:800;color:var(--navy);margin-bottom:3px}
.nxt-fn{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;margin-bottom:5px}
.nxt-title{font-size:11.5px;font-weight:600;color:var(--g900);line-height:1.4;margin-bottom:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nxt-owner{font-size:10px;color:var(--g500);font-weight:500}
.win-type{font-size:8.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.win-title{font-size:11px;font-weight:700;color:var(--g700);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:7px}
.win-meta{font-size:10px;color:var(--g400);display:flex;justify-content:space-between;align-items:center}
.tl2-wrap{position:relative;padding-bottom:34px;margin:0 2px}
.tl2-bar{height:20px;border-radius:10px;position:relative;overflow:hidden}
.tl2-qline{position:absolute;top:0;height:100%;width:2px;background:rgba(255,255,255,.4);pointer-events:none}
.tl2-pin-wrap{position:absolute;top:10px;transform:translate(-50%,-50%);z-index:10;pointer-events:none}
.tl2-pin-dot{width:32px;height:32px;border-radius:50%;background:var(--orange);border:3px solid #fff;box-shadow:0 0 0 4px rgba(255,104,32,.2),0 4px 16px rgba(255,104,32,.3);animation:tl2ping 2.5s ease-in-out infinite}
@keyframes tl2ping{0%,100%{box-shadow:0 0 0 4px rgba(255,104,32,.2),0 4px 16px rgba(255,104,32,.3)}50%{box-shadow:0 0 0 10px rgba(255,104,32,.07),0 4px 24px rgba(255,104,32,.5)}}
.tl2-pin-lbl{position:absolute;top:38px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:800;color:var(--orange);white-space:nowrap;background:#fff;padding:3px 9px;border-radius:8px;border:1px solid rgba(255,104,32,.2);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.tl2-qlabels{display:flex;margin-top:6px}
.tl2-ql{font-size:9px;font-weight:700;color:var(--g400);text-transform:uppercase;letter-spacing:.4px;text-align:center;overflow:hidden;white-space:nowrap;padding:0 2px}
.tl2-ql.is-active{color:var(--green)}
.tl2-ql.is-h2{color:var(--blue)}
.tl2-pills{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;border-top:1px solid var(--g100);padding-top:14px}
.tl2-pill{font-size:11px;font-weight:600;padding:5px 13px;border-radius:20px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tl2-pill-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.tl2-p-amber{background:rgba(245,158,11,.09);color:#92400E;border:1px solid rgba(245,158,11,.25)}
.tl2-p-blue{background:var(--blue-lt);color:var(--blue);border:1px solid rgba(0,102,214,.2)}
.tl2-p-green{background:var(--green-lt);color:var(--green);border:1px solid rgba(20,165,88,.25)}
.tl2-p-navy{background:rgba(0,40,85,.06);color:var(--navy);border:1px solid rgba(0,40,85,.12)}

/* ── PERIOD FILTER (deliverables + programs) ─────────── */
.period-bar{display:flex;align-items:center;gap:6px;padding:10px 0 0;margin-bottom:16px;flex-wrap:wrap}
.period-lbl{font-size:10px;font-weight:800;color:var(--g400);text-transform:uppercase;letter-spacing:.7px;margin-right:4px}
.period-btn{padding:5px 14px;border-radius:20px;font-size:12px;font-weight:600;border:1.5px solid var(--g200);background:#fff;cursor:pointer;color:var(--g600);transition:all .15s;white-space:nowrap}
.period-btn.on{background:var(--navy);color:#fff;border-color:var(--navy);box-shadow:0 2px 8px rgba(0,40,85,.2)}
.period-btn:hover:not(.on){border-color:var(--g400);background:var(--g50)}
.period-showing{font-size:11px;color:var(--g500);font-weight:500;margin-left:auto;padding:5px 12px;background:var(--g50);border-radius:20px;border:1px solid var(--g200)}
/* ── PASSWORD GATE (remove this block + #pw-gate div + checkPW script to disable) ── */
#pw-gate{position:fixed;inset:0;background:linear-gradient(145deg,#041B0E 0%,#082521 50%,#10503C 100%);display:flex;align-items:center;justify-content:center;z-index:9999;opacity:1;transition:opacity .45s;overflow:hidden}
#pw-gate::before{content:'';position:absolute;width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,rgba(44,147,130,.28) 0%,transparent 68%);top:-260px;left:-200px;pointer-events:none}
#pw-gate::after{content:'';position:absolute;width:550px;height:550px;border-radius:50%;background:radial-gradient(circle,rgba(242,62,48,.18) 0%,transparent 68%);bottom:-200px;right:-160px;pointer-events:none}
#pw-gate.fade-out{opacity:0;pointer-events:none}
.pw-bg-dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.055) 1px,transparent 1px);background-size:26px 26px;pointer-events:none}
.pw-box{background:#fff;border-radius:22px;padding:0;width:calc(100% - 40px);max-width:400px;box-shadow:0 40px 120px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.1);text-align:center;overflow:hidden;position:relative;z-index:1}
.pw-box-accent{height:5px;background:linear-gradient(90deg,#2C9382 0%,#1DD1E0 45%,#F23E30 100%)}
.pw-box-inner{padding:36px 44px 38px}
.pw-logo{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:30px}
.pw-logo-mark{width:40px;height:40px;flex-shrink:0}
.pw-logo-divider{width:1px;height:28px;background:#e2e8f0;flex-shrink:0}
.pw-logo-text{font-size:11px;font-weight:700;color:#64748b;letter-spacing:.9px;text-transform:uppercase;line-height:1.4;text-align:left}
.pw-title{font-size:23px;font-weight:800;color:#0f172a;margin-bottom:7px;letter-spacing:-.5px}
.pw-sub{font-size:13px;color:#64748b;margin-bottom:30px;line-height:1.55}
.pw-input-group{position:relative;text-align:left}
.pw-input-lock{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#94a3b8;pointer-events:none;display:flex}
.pw-input{width:100%;box-sizing:border-box;padding:13px 44px 13px 42px;border:1.5px solid #e2e8f0;border-radius:12px;font-size:14px;color:#1e293b;outline:none;transition:border-color .15s,box-shadow .15s;letter-spacing:.5px;background:#f8fafc}
.pw-input:focus{border-color:#2C9382;box-shadow:0 0 0 3px rgba(44,147,130,.14);background:#fff}
.pw-input.shake{animation:pwShake .35s ease}
.pw-eye{position:absolute;right:13px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:4px;color:#94a3b8;display:flex;line-height:1}
.pw-eye:hover{color:#64748b}
@keyframes pwShake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.pw-btn{width:100%;margin-top:12px;padding:14px;background:linear-gradient(135deg,#F23E30 0%,#d42a1d 100%);color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:800;cursor:pointer;transition:all .15s;letter-spacing:.3px;box-shadow:0 4px 18px rgba(242,62,48,.4)}
.pw-btn:hover{transform:translateY(-1px);box-shadow:0 7px 24px rgba(242,62,48,.5)}
.pw-btn:active{transform:translateY(0);box-shadow:0 3px 12px rgba(242,62,48,.35)}
.pw-hint{font-size:11.5px;color:#94a3b8;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:5px}
.pw-error{font-size:12px;color:#dc2626;margin-top:6px;min-height:18px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:4px}
.pw-footer{font-size:11px;color:#94a3b8;margin-top:24px;padding-top:20px;border-top:1px solid #f1f5f9;display:flex;align-items:center;justify-content:center;gap:6px}

/* ── BY CHANNEL VIEW ─────────────────────────────────── */
.del-view-tog{display:flex;border-bottom:2px solid var(--g100);margin-bottom:14px;background:none;border-radius:0;padding:0;gap:0}
.del-view-btn{padding:10px 22px;font-size:13px;font-weight:600;color:var(--g400);background:none;border:none;border-bottom:3px solid transparent;margin-bottom:-2px;cursor:pointer;white-space:nowrap;transition:all .15s;border-radius:4px 4px 0 0;letter-spacing:-.1px}
.del-view-btn.on{color:var(--navy);border-bottom-color:var(--navy);font-weight:700}
.del-view-btn:hover:not(.on){color:var(--g800);background:var(--g50)}
.ws-wrap{max-width:980px;margin:0 auto}
.ws-grid{display:flex;flex-direction:column;gap:5px}
.ws-card{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06),0 0 0 1px rgba(0,0,0,.05);transition:box-shadow .15s}
.ws-card:hover{box-shadow:0 3px 12px rgba(0,0,0,.09),0 0 0 1px rgba(0,0,0,.07)}
.ws-card-hd{display:flex;align-items:center;gap:12px;padding:11px 16px;cursor:pointer;user-select:none;border-left:4px solid transparent;transition:background .12s}
.ws-card-hd:hover{background:var(--g50)}
.ws-ch-dot{display:none}
.ws-ch-name{font-size:13px;font-weight:700;color:var(--g900);flex:1;letter-spacing:-.1px}
.ws-badges{display:flex;gap:5px;align-items:center;flex-shrink:0}
.ws-badge{font-size:11px;font-weight:600;padding:2px 9px;border-radius:10px;white-space:nowrap}
.ws-badge-active{background:#e6f4f1;color:#0b6952;border:1px solid #b2ddd6}
.ws-badge-queue{background:#eef1ff;color:#3451b2;border:1px solid #c5cef8}
.ws-badge-0{background:var(--g100);color:var(--g400);border:1px solid var(--g200)}
.ws-chevron{color:var(--g300);flex-shrink:0;transition:transform .2s}
.ws-card.open .ws-chevron{transform:rotate(180deg)}
.ws-body{display:none;padding:2px 16px 16px 20px}
.ws-card.open .ws-body{display:block}
.ws-section{margin-top:14px}
.ws-sec-title{font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:6px;margin-bottom:7px;padding-bottom:7px;border-bottom:1px solid var(--g100)}
.ws-sec-cnt{font-size:9.5px;font-weight:700;padding:1px 7px;border-radius:8px}
.ws-item{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid rgba(0,0,0,.04)}
.ws-item:last-child{border-bottom:none}
.ws-item-sub{padding-left:6px}
.ws-av{width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:800;color:#fff}
.ws-av-empty{background:var(--g300);color:var(--g500)}
.ws-item-body{min-width:0}
.ws-item-title{font-size:12.5px;font-weight:500;color:#1e293b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
.ws-title-lnk{color:inherit;text-decoration:none}
.ws-title-lnk:hover{color:var(--blue);text-decoration:underline}
.ws-item-meta{display:flex;align-items:center;gap:5px;margin-top:1px}
.ws-key-sm{font-size:10px;color:var(--g400);font-weight:500}
.ws-item-owner{font-size:10.5px;color:var(--g500)}
.ws-item-sep{color:var(--g300);font-size:10px}
.ws-item-right{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0;min-width:72px}
.ws-type-tag{font-size:10px;font-weight:600;padding:2px 7px;border-radius:5px;white-space:nowrap}
.ws-item-date{font-size:10px;color:var(--g400);white-space:nowrap}

  "Community":"#D97706","Webinars & Events":"#F59E0B","PR & Exec Comms":"#059669",
  "Launches & GTM":"#E53935","Systems & AI":"#002855"
};
const BU_COLORS = {"FastField":"#0066D6","Pave":"#7C3AED","Core (QB)":"#14A558","Cross-BU":"#0891B2"};
const LABEL_COLORS = {"FF-MKT":"#0066D6","Pave-MKT":"#7C3AED","QB-Core-MKT":"#14A558","CrossBU-MKT":"#0891B2"};
const TYPE_CLS = {
  "Blog/SEO":"t-b","Blog":"t-b","Guide":"t-b","Glossary":"t-b","Content":"t-b",

  "Enablement":"t-n","Event Ops":"t-n","Event":"t-n","Webinar":"t-n",

  "in-progress":["var(--green)","In Progress"],
  "blocked":["var(--red)","Blocked"],
  "on-hold":["var(--amber)","On Hold"],
  "planning":["var(--blue)","Planning"],

};

function badge(s){const c=SC[s]||SC["on-track"];return `<span class="badge ${c.cls}"><span style="width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block"></span>${c.label}</span>`;}
function badgeLight(s){
  const lbl={'on-track':'On Track','at-risk':'At Risk','off-track':'Off Track','planning':'Planning'};
  const extra=s==='at-risk'?' badge-lt-rk':s==='off-track'?' badge-lt-off':'';
  return `<span class="badge-lt${extra}">${lbl[s]||s}</span>`;
}
function typeTag(t){return `<span class="tag ${TYPE_CLS[t]||'t-n'}">${t}</span>`;}
function buTag(bu){if(!bu||bu==='Unknown')return '<span class="sp-bu-tag" style="background:var(--g100);color:var(--g400);border:1px dashed var(--g300);font-style:italic;opacity:.7">No BU</span>';const cls=bu==='FastField'?'ff':bu==='Pave'?'pave':bu==='Core (QB)'||bu==='Core'?'core':bu==='Cross-BU'?'cross':null;const lbl=bu==='FastField'?'FF':bu==='Core (QB)'?'Core':bu;return cls?`<span class="sp-bu-tag sp-bu-${cls}">${lbl}</span>`:`<span class="sp-bu-tag" style="background:var(--g100);color:var(--g400);border:1px solid var(--g200)">${lbl}</span>`;}
function labelChip(lbl){const col=LABEL_COLORS[lbl]||"#64748B";return `<span class="del-lbl" style="background:${col}15;color:${col}">${lbl}</span>`;}
function statusPill(s){const[col,txt]=STATUS_DOT[s]||["var(--g300)","Unknown"];return `<span class="status-pill"><span class="sdot" style="background:${col}"></span>${txt}</span>`;}
function prioBadge(p){return `<span class="prio-badge ${PRIO_CLS[p]||'prio-p3'}">${p}</span>`;}

let ofBU='All', ofCh='All', ofLbl='All', ofSP='All', ofPrio='All', ofQtr='All', ofPeriod='All', ofStatus='All', ofOwner='All', delQtr='Q3', delPage=1;
let rmQtr='Q3', rmFn='All', rmBU='All', rmStatus='All', rmOwner='All', rmShowDone=false;
let _rmCollapsed=new Set();
let _rmFocusMode=false;
function setRM(w,v){
  if(w==='qtr')rmQtr=v;
  else if(w==='fn')rmFn=v;
  else if(w==='bu')rmBU=v;
  else if(w==='status')rmStatus=v;
  else if(w==='owner')rmOwner=v;
  else if(w==='show-done')rmShowDone=!rmShowDone;
  else if(w==='collapse-fn'){if(_rmCollapsed.has(v))_rmCollapsed.delete(v);else _rmCollapsed.add(v);}
  else if(w==='focus'){_rmFocusMode=!_rmFocusMode;}
  document.getElementById('roadmap').innerHTML='';renderRoadmap();
}

/* ── ROADMAP GANTT RENDER ────────────────────────────────────────── */
function renderRoadmap(){
  const FN_COL={'Product Launches':'#4338ca','Events':'#0d9488','Brand Refresh':'#7c3aed','Brand & Creative':'#c2410c','Web':'#0891b2','Demand':'#1d4ed8','Content & SEO':'#0066D6','Community':'#15803d'};
  const FN_ORDER=['Product Launches','Events','Brand Refresh','Brand & Creative','Web','Demand','Content & SEO','Community'];
  const FN_PROGRAM_HEADER={'Brand Refresh':{label:'Brand & Web Program',tag:'Cross-Functional'}};
  const FOCUS_TIERS=new Set(['Tier 1','Tier 2','Brand Refresh','Program','Sponsored T1','Sponsored T2','Empower 2026','Empower Pro','FY27 Empower']);
  // item.end set → duration bar; item.end null → point-in-time diamond milestone
  const ST={
    'confirmed':   {op:1,    dash:false, live:true,  lbl:'In Progress', dot:'#16a34a'},
    'in-progress': {op:1,    dash:false, live:true,  lbl:'In Progress', dot:'#16a34a'},
    'planned':     {op:0.65, dash:false, live:false, lbl:'Planned',     dot:'#1d4ed8'},
    'tbc':         {op:1,    dash:true,  live:false, lbl:'TBC',         dot:'#94a3b8'},
    'live':        {op:1,    dash:false, live:true,  lbl:'Live',        dot:'#15803d'},
    'done':        {op:0.4,  dash:false, live:false, lbl:'Done',        dot:'#6b7280'},
  };
  const ST_DOT=Object.fromEntries(Object.entries(ST).map(([k,v])=>[k,v.dot]));
  const RANGES={
    'Q3':{s:new Date('2026-07-01T00:00:00'),e:new Date('2026-09-30T23:59:59'),mo:[{lbl:'July 2026',s:'2026-07-01',e:'2026-07-31'},{lbl:'August 2026',s:'2026-08-01',e:'2026-08-31'},{lbl:'September 2026',s:'2026-09-01',e:'2026-09-30'}]},
    'Q4':{s:new Date('2026-10-01T00:00:00'),e:new Date('2026-12-31T23:59:59'),mo:[{lbl:'October 2026',s:'2026-10-01',e:'2026-10-31'},{lbl:'November 2026',s:'2026-11-01',e:'2026-11-30'},{lbl:'December 2026',s:'2026-12-01',e:'2026-12-31'}]},
    'All':{s:new Date('2026-07-01T00:00:00'),e:new Date('2026-12-31T23:59:59'),mo:[{lbl:'Jul',s:'2026-07-01',e:'2026-07-31'},{lbl:'Aug',s:'2026-08-01',e:'2026-08-31'},{lbl:'Sep',s:'2026-09-01',e:'2026-09-30'},{lbl:'Oct',s:'2026-10-01',e:'2026-10-31'},{lbl:'Nov',s:'2026-11-01',e:'2026-11-30'},{lbl:'Dec',s:'2026-12-01',e:'2026-12-31'}]}
  };
  const rng=RANGES[rmQtr]||RANGES['Q3'];
  const tMs=rng.e-rng.s;
  const tDays=tMs/86400000;
  const p=d=>Math.max(0,Math.min(99,(new Date(d+'T12:00:00')-rng.s)/tMs*100));
  const wkW=Math.max(1.5,7/tDays*100); // width of 1 week tick label
  const now=new Date();
  const todayP=(now-rng.s)/tMs*100;
  const showToday=todayP>=0&&todayP<=100;
  const todayLbl=now.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  // filter + group
  const baseFilter=i=>(rmQtr==='All'||i.qtr===rmQtr)&&(rmFn==='All'||i.fn===rmFn)&&(rmBU==='All'||i.bu===rmBU)&&(rmOwner==='All'||i.owner===rmOwner);
  const items=ROADMAP.filter(i=>baseFilter(i)&&i.status!=='done'&&(rmStatus==='All'||i.status===rmStatus)&&(!_rmFocusMode||FOCUS_TIERS.has(i.tier)));
  const doneItems=ROADMAP.filter(i=>baseFilter(i)&&i.status==='done').sort((a,b)=>b.weekOf.localeCompare(a.weekOf));
  // per-owner active load (full roadmap, unfiltered, non-done)
  const ownerLoad={};
  ROADMAP.filter(i=>i.status!=='done').forEach(i=>{i.owner.split(',').forEach(o=>{const k=o.trim();ownerLoad[k]=(ownerLoad[k]||0)+1;});});
  const grouped={};items.forEach(i=>{if(!grouped[i.fn])grouped[i.fn]=[];grouped[i.fn].push(i);});
  // month header strip
  const moHtml=rng.mo.map(m=>{
    const ms=new Date(m.s+'T00:00:00'),me=new Date(m.e+'T23:59:59');
    const l=Math.max(0,(ms-rng.s)/tMs*100),w=(me-ms)/tMs*100;
    return `<div class="gantt-mo" style="left:${l.toFixed(2)}%;width:${w.toFixed(2)}%">${m.lbl}</div>`;
  }).join('');
  // week tick strip
  let wkHtml='';
  const wd=new Date(rng.s);while(wd.getDay()!==1)wd.setDate(wd.getDate()+1);
  while(wd<rng.e){
    const wp=(wd-rng.s)/tMs*100;
    if(wp>0&&wp<99)wkHtml+=`<div class="gantt-wk" style="left:${wp.toFixed(2)}%;width:${wkW.toFixed(2)}%">${wd.toLocaleDateString('en-US',{month:'short',day:'numeric'})}</div>`;
    wd.setDate(wd.getDate()+7);
  }
  // per-row grid overlays (shared)
  function rowOv(){
    let o='';
    const wd2=new Date(rng.s);while(wd2.getDay()!==1)wd2.setDate(wd2.getDate()+1);
    while(wd2<rng.e){const wp=(wd2-rng.s)/tMs*100;if(wp>0&&wp<99)o+=`<div class="gantt-wk-div" style="left:${wp.toFixed(2)}%"></div>`;wd2.setDate(wd2.getDate()+7);}
    rng.mo.slice(1).forEach(m=>{const mp=(new Date(m.s+'T00:00:00')-rng.s)/tMs*100;o+=`<div class="gantt-mo-div" style="left:${mp.toFixed(2)}%"></div>`;});
    if(showToday)o+=`<div class="gantt-today-v" style="left:${todayP.toFixed(2)}%"></div>`;
    return o;
  }
  // controls
  const allFns=['All',...new Set(ROADMAP.map(i=>i.fn))];
  const allBUs=['All',...new Set(ROADMAP.map(i=>i.bu))];
  const allOwners=['All',...Array.from(new Set(ROADMAP.map(i=>i.owner))).sort()];
  const fnOpts=allFns.map(f=>`<option value="${f}"${rmFn===f?' selected':''}>${f}</option>`).join('');
  const buOpts=allBUs.map(b=>`<option value="${b}"${rmBU===b?' selected':''}>${b}</option>`).join('');
  const stOpts=[['All','All statuses'],['in-progress','In Progress'],['planned','Planned'],['tbc','TBC']].map(([v,l])=>`<option value="${v}"${rmStatus===v?' selected':''}>${l}</option>`).join('');
  const ownerOpts=allOwners.map(o=>`<option value="${o}"${rmOwner===o?' selected':''}>${o==='All'?'All owners':o}</option>`).join('');
  const overdueCount=items.filter(i=>i.status==='tbc'&&new Date(i.weekOf+'T12:00:00')<now).length;
  const barCount=items.filter(i=>i.end).length;
  const mstCount=items.filter(i=>!i.end).length;
  let html=`<div class="rm-ctrl">
    <div class="rm-seg">${['Q3','Q4','All'].map(q=>`<button class="rm-seg-btn${rmQtr===q?' on':''}" onclick="setRM('qtr','${q}')">${q==='All'?'Full H2':q}</button>`).join('')}</div>
    <select class="rm-drop${rmFn!=='All'?' active':''}" onchange="setRM('fn',this.value)">${fnOpts}</select>
    <select class="rm-drop${rmBU!=='All'?' active':''}" onchange="setRM('bu',this.value)">${buOpts}</select>
    <select class="rm-drop${rmStatus!=='All'?' active':''}" onchange="setRM('status',this.value)">${stOpts}</select>
    <select class="rm-drop${rmOwner!=='All'?' active':''}" onchange="setRM('owner',this.value)">${ownerOpts}</select>
    <button class="rm-focus-btn" onclick="(function(){const o=document.querySelector('.gcal-outer');if(!o)return;const i=o.querySelector('.gcal-inner');if(!i)return;const nw=o.querySelectorAll('.gcal-head-tc .gcal-week-hd').length;const tw=o.querySelector('.gcal-today-hd');if(tw){const or=o.getBoundingClientRect();const tr=tw.getBoundingClientRect();o.scrollLeft=o.scrollLeft+(tr.left-or.left)-210;}else o.scrollLeft=0;})()" title="Scroll to current week" style="padding:5px 10px">↗ Today</button>
    <button class="rm-focus-btn${_rmFocusMode?' on':''}" onclick="setRM('focus','x')" title="Show only key launches, events &amp; milestones">${_rmFocusMode?'◆ Highlights':'◇ Highlights'}</button>
    <span class="rm-ctrl-count">${barCount} item${barCount!==1?'s':''} · ${mstCount} milestone${mstCount!==1?'s':''}</span>
    ${overdueCount>0?`<span style="font-size:11px;font-weight:700;background:#fef3c7;color:#92400e;border:1px solid #fcd34d;border-radius:99px;padding:3px 10px">⚠ ${overdueCount} overdue TBC</span>`:''}
  </div>`;
  // legend
  const mkSwatch=(col,dash=false)=>`<span style="display:inline-block;width:10px;height:14px;border-radius:2px;background:${dash?col+'12':col+'15'};border-left:${dash?`1px dashed ${col}`:`3px solid ${col}`};vertical-align:middle"></span>`;
  html+=`<div class="rm-legend">
    <span class="rm-leg-item" style="font-size:9px;font-weight:700;color:var(--g400);text-transform:uppercase;letter-spacing:.05em;margin-right:6px">Card = item in its delivery week:</span>
    <span class="rm-leg-item">${mkSwatch('#16a34a')} In Progress</span>
    <span class="rm-leg-item">${mkSwatch('#1d4ed8')} Planned</span>
    <span class="rm-leg-item">${mkSwatch('#94a3b8',true)} TBC</span>
    <span class="rm-leg-item">${mkSwatch('#d97706')} Overdue</span>
    <span class="rm-leg-item" style="margin-left:8px"><span style="display:inline-block;width:5px;height:5px;border-radius:50%;background:#f97316;vertical-align:middle;margin-right:3px"></span>No brief &nbsp;·&nbsp; ↗ Jira</span>
  </div>`;
  if(!items.length){
    html+=`<div class="rm-empty"><div style="font-size:28px;margin-bottom:10px">📋</div><div style="font-size:14px;font-weight:700;color:var(--g700)">No items match</div><div style="font-size:12px;color:var(--g400);margin-top:4px">Try adjusting the filters</div></div>`;
    document.getElementById('roadmap').innerHTML=html;return;
  }
  // ── CALENDAR GRID ─────────────────────────────────────────────────
  const calWks=[];
  {const cw=new Date(rng.s);while(cw.getDay()!==1)cw.setDate(cw.getDate()+1);while(cw<=rng.e){calWks.push(cw.toISOString().slice(0,10));cw.setDate(cw.getDate()+7);}}
  const nWks=calWks.length;
  const todayStr=now.toISOString().slice(0,10);
  const todayWkIdx=calWks.findIndex((w,i)=>todayStr>=w&&(i===nWks-1||todayStr<calWks[i+1]));
  function wkOf(dateStr){const idx=calWks.findIndex((w,i)=>dateStr>=w&&(i===nWks-1||dateStr<calWks[i+1]));return idx>=0?idx:0;}
  const wkHdHtml=calWks.map((w,i)=>{
    const d=new Date(w+'T12:00:00');
    const lbl=d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
    const isT=i===todayWkIdx;
    return `<div class="gcal-week-hd${isT?' gcal-today-hd':''}">${lbl}${isT?'<br><span style="font-size:6.5px;letter-spacing:.04em;opacity:.8">TODAY</span>':''}</div>`;
  }).join('');
  // month header spans
  const MO_LBL={'01':'January','02':'February','03':'March','04':'April','05':'May','06':'June','07':'July','08':'August','09':'September','10':'October','11':'November','12':'December'};
  const moSpans=[];
  calWks.forEach((w,i)=>{
    const mo=w.slice(5,7);
    if(!moSpans.length||moSpans[moSpans.length-1].mo!==mo)moSpans.push({mo,start:i,end:i});
    else moSpans[moSpans.length-1].end=i;
  });
  const moHdHtml=moSpans.map(({mo,start,end})=>{
    const span=end-start+1;
    const isToday=todayWkIdx>=start&&todayWkIdx<=end;
    return `<div style="flex:${span};text-align:center;font-size:10px;font-weight:800;letter-spacing:.04em;color:${isToday?'#dc2626':'var(--g600)'};padding:5px 4px;border-right:2px solid var(--g200);overflow:hidden;white-space:nowrap;background:${isToday?'#fff0f0':'var(--g50)'}">${MO_LBL[mo]}</div>`;
  }).join('');
  const emptyWkCells=()=>calWks.map((w,i)=>`<div class="gcal-week-cell${i===todayWkIdx?' gcal-today-col':''}"></div>`).join('');
  let gHtml=`<div class="gcal-outer"><div class="gcal-inner">
    <div class="gcal-head" style="flex-direction:column">
      <div style="display:flex;border-bottom:1px solid var(--g200)">
        <div class="gcal-head-lc" style="font-size:9px;color:var(--g300);align-items:flex-end;padding-bottom:4px">H2 2026</div>
        <div class="gcal-head-tc">${moHdHtml}</div>
      </div>
      <div style="display:flex">
        <div class="gcal-head-lc">Track</div>
        <div class="gcal-head-tc">${wkHdHtml}</div>
      </div>
    </div>`;
  FN_ORDER.forEach(fn=>{
    const gi=grouped[fn]||[];
    const col=FN_COL[fn]||'#64748b';
    const fnEnc=fn.replace(/&/g,'&amp;');
    const isCollapsed=_rmCollapsed.has(fn);
    const chevron=isCollapsed?'▶':'▼';
    if(FN_PROGRAM_HEADER[fn]){
      const ph=FN_PROGRAM_HEADER[fn];
      gHtml+=`<div class="gcal-prog-band"><div class="gcal-prog-lc"><span style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7c3aed">${ph.label}</span><span style="font-size:7.5px;font-weight:600;background:#7c3aed20;color:#7c3aed;border:1px solid #7c3aed35;padding:1px 6px;border-radius:99px;margin-left:6px">${ph.tag}</span></div><div class="gcal-prog-tc"></div></div>`;
    }
    gHtml+=`<div class="gcal-grp-row" onclick="setRM('collapse-fn','${fnEnc}')" style="border-left:3px solid ${col}">
      <div class="gcal-grp-lc">
        <span style="font-size:9px;color:${col}">${chevron}</span>
        <span style="font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:${col}">${fn}</span>
        ${gi.length?`<span style="font-size:8.5px;font-weight:700;padding:1px 6px;border-radius:99px;background:${col}20;color:${col}">${gi.length}</span>`:''}
      </div>
      <div class="gcal-grp-tc">${emptyWkCells()}</div>
    </div>`;
    if(!isCollapsed){
      // cards placed at DELIVERY week (item.end if set, else item.weekOf)
      const byWk={};
      gi.forEach(item=>{
        const wi=wkOf(item.end||item.weekOf);
        if(!byWk[wi])byWk[wi]=[];
        byWk[wi].push(item);
      });
      const cellsHtml=calWks.map((w,i)=>{
        const isT=i===todayWkIdx;
        const cards=(byWk[i]||[]).map(item=>{
          const st=ST[item.status]||ST.tbc;
          const isOv=item.status==='tbc'&&new Date((item.end||item.weekOf)+'T12:00:00')<now;
          const c=isOv?'#d97706':st.dot;
          const bg=st.dash?`${c}12`:`${c}18`;
          const bdr=st.dash?`border:1px dashed ${c};`:`border-left:3px solid ${c};`;
          const stLbl=isOv?'Overdue':st.lbl;
          const jiraBtn=item.jira?`<a href="${JIRA}${item.jira}" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="font-size:7.5px;font-weight:700;color:${c};opacity:.8;text-decoration:none" title="Jira">↗</a>`:'';
          const briefBtn=item.brief?`<a href="${item.brief}" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="font-size:7.5px;font-weight:600;color:${c};opacity:.7;text-decoration:none" title="Brief">B</a>`:'';
          const noBrief=(!item.brief&&(item.status==='confirmed'||item.status==='in-progress'))?`<span style="width:4px;height:4px;border-radius:50%;background:#f97316;display:inline-block" title="No brief"></span>`:'';
          return `<div class="gcal-card" style="background:${bg};${bdr}" onclick="openRMPanel('${item.id}');event.stopPropagation()">
            <span class="gcal-card-title" style="color:${c}">${item.title}</span>
            <span class="gcal-card-meta"><span style="font-size:7.5px;color:${c};opacity:.75">${stLbl}</span>${noBrief}${jiraBtn}${briefBtn}</span>
          </div>`;
        }).join('');
        return `<div class="gcal-week-cell${isT?' gcal-today-col':''}">${cards}</div>`;
      }).join('');
      gHtml+=`<div class="gcal-items-row"><div class="gcal-items-lc"></div><div class="gcal-items-tc">${cellsHtml}</div></div>`;
    }
  });
  gHtml+=`</div></div>`;
  html+=gHtml;
  document.getElementById('roadmap').innerHTML=html;
  // scroll so today's column is near the left edge (after layout)
  requestAnimationFrame(()=>{
    const outer=document.querySelector('.gcal-outer');
    if(!outer||todayWkIdx<0)return;
    const inner=outer.querySelector('.gcal-inner');
    if(!inner)return;
    const colW=(inner.scrollWidth-190)/nWks;
    outer.scrollLeft=Math.max(0,(todayWkIdx-1)*colW);
  });
}

/* ── ROADMAP SIDE PANEL ──────────────────────────────────────────── */
function _rmEscHandler(e){if(e.key==='Escape')closeRMPanel();}
function closeRMPanel(){
  const panel=document.getElementById('rm-panel');
  if(panel){panel.classList.remove('open');panel.setAttribute('aria-hidden','true');}
  document.removeEventListener('keydown',_rmEscHandler);
}
function openRMPanel(id){
  const item=ROADMAP.find(r=>r.id===id);
  if(!item)return;
  const FN_COL={'Product Launches':'#4338ca','Events':'#0d9488','Brand Refresh':'#7c3aed','Brand & Creative':'#c2410c','Web':'#0891b2','Demand':'#1d4ed8','Content & SEO':'#0066D6','Community':'#15803d'};
  const ST_LBL={'confirmed':'Confirmed','planned':'Planned','tbc':'TBC','live':'Live','done':'Done'};
  const ST_COL={'confirmed':'#0d9488','planned':'#1d4ed8','tbc':'#94a3b8','live':'#15803d','done':'#6b7280'};
  const col=FN_COL[item.fn]||'#64748b';
  const now=new Date();
  const isOverdue=item.status==='tbc'&&new Date(item.weekOf+'T12:00:00')<now;
  const stCol=isOverdue?'#d97706':(ST_COL[item.status]||'#94a3b8');
  const stLbl=isOverdue?'Overdue — TBC':(ST_LBL[item.status]||item.status);
  const d=new Date(item.weekOf+'T12:00:00');
  const wkFmt=d.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
  let body=`<span class="rmp-fn-tag" style="color:${col}">${item.fn}</span>
  <div class="rmp-title">${item.title}</div>
  <span class="rmp-status-chip" style="background:${stCol}18;color:${stCol};border:1.5px solid ${stCol}40">
    <span style="width:7px;height:7px;border-radius:50%;background:${stCol};display:inline-block;flex-shrink:0"></span>${stLbl}
  </span>
  <div class="rmp-meta-grid">
    <div class="rmp-meta-cell"><div class="rmp-meta-lbl">Business Unit</div><div class="rmp-meta-val">${item.bu}</div></div>
    <div class="rmp-meta-cell"><div class="rmp-meta-lbl">Tier</div><div class="rmp-meta-val">${item.tier}</div></div>
    <div class="rmp-meta-cell"><div class="rmp-meta-lbl">Owner</div><div class="rmp-meta-val">${item.owner}</div></div>
    <div class="rmp-meta-cell"><div class="rmp-meta-lbl">${item.end?'Start → End':'Milestone date'}</div><div class="rmp-meta-val" style="font-size:11px">${item.end?(d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' → '+new Date(item.end+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})):wkFmt}</div></div>
  </div>`;
  if(item.brief||item.jira){
    body+=`<div class="rmp-links">`;
    if(item.brief)body+=`<a href="${item.brief}" target="_blank" rel="noopener" class="rmp-btn rmp-btn-brief">📄&nbsp; Open Brief (Confluence)</a>`;
    if(item.jira)body+=`<a href="${JIRA}${item.jira}" target="_blank" rel="noopener" class="rmp-btn rmp-btn-jira">🔗&nbsp; ${item.jira} — Open in Jira</a>`;
    body+=`</div>`;
  } else {
    body+=`<div style="background:var(--g50);border-radius:9px;padding:12px 14px;font-size:12px;color:var(--g400);margin-bottom:16px">No brief or Jira issue linked yet.</div>`;
  }
  body+=`<div class="rmp-footer">${item.qtr} · ${item.fn}${item.bu!=='All'?' · '+item.bu:''}</div>`;
  document.getElementById('rm-panel-body').innerHTML=body;
  const panel=document.getElementById('rm-panel');
  panel.classList.add('open');
  panel.setAttribute('aria-hidden','false');
  document.addEventListener('keydown',_rmEscHandler);
}

function go(id,btn){

}

function showToast(msg){
  const t=document.getElementById('copy-toast');
  if(!t)return;
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2400);
}

function getStatusUpdate(iniKey,btn){
  const ini=DATA.initiatives.find(i=>i.key===iniKey);
  if(!ini)return;
  const recent=RECENT_TASKS[iniKey];
  if(!recent||!recent.pulledAt){showToast('Run the updater script to fetch fresh data');return;}
  const scope=ini.scope||{};
  const BU_LABEL={'FastField':'FastField','Pave':'Pave','Core (QB)':'Quickbase Core','Cross-BU':'Cross-BU'};
  const CH_LABEL={'Content & SEO':'Content','Creative & Design':'Creative','Email & Lifecycle':'Email','Events & Experiences':'Events','PMM / Product':'Product launches','Web & Digital':'Web','PR & Comms':'PR & comms','Social Media':'Social','Community':'Community','Marketing Analytics':'Analytics','Demand Gen':'Demand Gen','UX & Design':'UX'};
  const statusEmoji={'on-track':'🟢','at-risk':'🟡','off-track':'🔴'}[ini.status]||'⚪';
  const statusLabel={'on-track':'On Track','at-risk':'At Risk','off-track':'Off Track'}[ini.status]||ini.status;
  let msg=`*${ini.title}* — ${statusEmoji} ${statusLabel}`;
  if(ini.owner)msg+=`\nOwner: ${ini.owner}`;
  const total=recent.total||0;
  if(!total){
    msg+=`\n\n*Shipped (last 30 days):*\n• Nothing marked Done in Jira yet`;
  }else{
    msg+=`\n\n*Shipped (last 30 days)* — ${total} task${total!==1?'s':''} done`;
    const ordKeys=[...(scope.bus||scope.chs||[]),...Object.keys(recent.groups||{}).filter(k=>!(scope.bus||scope.chs||[]).includes(k)&&k!=='Other')];
    if((recent.groups||{})['Other'])ordKeys.push('Other');
    ordKeys.forEach(key=>{
      const g=(recent.groups||{})[key];if(!g)return;
      const dk=BU_LABEL[key]||CH_LABEL[key]||key;
      msg+=`\n• *${dk}:* ${g.count} task${g.count!==1?'s':''}`;
      (g.titles||[]).forEach(t=>{msg+=`\n  – ${t}`;});
    });
  }
  const cleanT=t=>t.replace(/^\[[^\]]+\]\s*/,'');
  const active=(ini.p1progs||[]).filter(p=>p.status==='in-progress');
  const blocked=(ini.p1progs||[]).filter(p=>p.status==='blocked');
  if(active.length){msg+=`\n\n*In flight:*`;active.forEach(p=>{msg+=`\n• ${cleanT(p.title)}`;});}
  if(blocked.length){msg+=`\n\n*🚧 Blocked (${blocked.length}):*`;blocked.forEach(p=>{msg+=`\n• ${cleanT(p.title)}`;});}
  msg+=`\n\n_Data as of ${recent.pulledAt}_`;
  navigator.clipboard.writeText(msg).then(()=>showToast('✓ Copied to clipboard')).catch(()=>prompt('Copy this update:',msg));
}

function toggleCard(hdr) {

function toggleP1Overflow(btn, count) {
  const container = btn.closest('.sp-progs');
  const overflow = container.querySelectorAll('.sp-p1-overflow');
  const expanded = btn.dataset.exp === '1';
  overflow.forEach(el => { el.style.display = expanded ? '' : 'flex'; });
  btn.dataset.exp = expanded ? '0' : '1';
  btn.textContent = expanded ? `+ ${count} more →` : `− show fewer`;
}

/* ══════════════════════════════════════════════════════
   AI INSIGHT HELPER
══════════════════════════════════════════════════════ */
function genInsight(ini){
  const blkCnt=(ini.p1progs||[]).filter(p=>p.status==='blocked').length;
  const behind=Q3_PCT-ini.pct;
  const projPct=Q3_PCT>0?Math.min(100,Math.round(ini.pct/Q3_PCT*100)):ini.pct;
  const projDone=Math.round(ini.total*projPct/100);
  const willSlip=Math.max(0,ini.total-projDone);
  if(ini.status==='off-track'){
    const blkStr=blkCnt>0?` ${blkCnt} program${blkCnt>1?'s':''} blocked.`:'';
    return `<div class="sp-insight sp-insight-risk"><span class="sp-i-icon">⚠</span><span>${Math.abs(behind)}pts behind Q3 pace.${blkStr} At current velocity: ${projDone} of ${ini.total} tasks close by Q3 — <strong>${willSlip} tasks may carry to Q4.</strong></span></div>`;
  }
  if(ini.status==='at-risk'){
    const blkStr=blkCnt>0?`${blkCnt} program${blkCnt>1?'s':''} blocked · `:'';
    return `<div class="sp-insight sp-insight-warn"><span class="sp-i-icon">⚡</span><span>${blkStr}Projecting ${projDone} of ${ini.total} tasks by Q3 end — <strong>${willSlip} task${willSlip===1?'':'s'} may carry to Q4.</strong></span></div>`;
  }
  const ip=(ini.p1progs||[]).filter(p=>p.status==='in-progress').length;
  if(ip>0)
    return `<div class="sp-insight sp-insight-ok"><span class="sp-i-icon">↑</span><span>${ip} program${ip>1?'s':''} actively in execution — on track for Q3.</span></div>`;
  return `<div class="sp-insight sp-insight-ok"><span class="sp-i-icon">↗</span><span>Q3 underway — planning active across ${ini.total} tasks through Sep 30.</span></div>`;
}

function renderPrograms(){
  const spBtns = ['All',...DATA.initiatives.map(i=>i.key)].map(k=>{
    const ini = DATA.initiatives.find(i=>i.key===k);
    const lbl = ini ? ini.title.split('—')[0].trim().replace('Corporate Communications','Corp Comms').replace('Marketing Systems & AI','Systems & AI').replace('Program Management','PM') : 'All';
    return `<button class="pf-btn${ofSP===k?' on':''}" onclick="setProgFilter('sp','${k}')">${lbl}</button>`;
  }).join('');
  const prioBtns = ['All','P1','P2','P3'].map(p=>`<button class="pf-btn${ofPrio===p?' on':''}" onclick="setProgFilter('prio','${p}')">${p==='All'?'All Priorities':p}</button>`).join('');
  const qtrBtns = ['All','Q2','Q3','Q4'].map(q=>`<button class="pf-btn${ofQtr===q?' on':''}" onclick="setProgFilter('qtr','${q}')">${q==='All'?'All Quarters':q+' 2026'}</button>`).join('');

  const spKeys = DATA.initiatives.map(i=>i.key).filter(k=>ofSP==='All'||k===ofSP);
  const groups = spKeys.map(spKey=>{
    const ini = DATA.initiatives.find(i=>i.key===spKey);
    const progs = DATA.programs.filter(p=>
      p.sp===spKey &&
      (ofPrio==='All'||p.priority===ofPrio) &&
      (ofQtr==='All'||p.title.includes(ofQtr)));
    if(!progs.length) return '';
    const inFlight=progs.filter(p=>p.status==='in-progress').length;
    const blocked=progs.filter(p=>p.status==='blocked').length;
    const _SORT_ORDER={blocked:0,'in-progress':1,planning:2,intake:2,'on-hold':3,done:4};
    const sortedProgs=[...progs].sort((a,b)=>(_SORT_ORDER[a.status]??5)-(_SORT_ORDER[b.status]??5));
    const _fmtDue=d=>{if(!d)return '';const dt=new Date(d+'T12:00:00');const mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][dt.getMonth()];const now=new Date();const isPast=dt<now&&dt.toDateString()!==now.toDateString();return `<span style="font-size:11px;${isPast?'color:var(--red);font-weight:600':'color:var(--g500)'}">${mo} ${dt.getDate()}${isPast?' ⚠':''}</span>`;};
    const rows = sortedProgs.map(p=>{
      const [dotCol]=STATUS_DOT[p.status]||["var(--g300)",""];
      const ownerFmt=p.owner?(p.owner.includes(', ')?p.owner.split(', ').reverse().join(' '):p.owner):null;
      const goalChip=p.goal?`<span class="prog-goal-chip" style="background:${ini.color}22;color:${ini.color};border:1px solid ${ini.color}55" title="Goal ${p.goal}: ${(ini.goals||[])[p.goal-1]||''}">G${p.goal}</span>`:'';
      return `<tr class="prog-row" onclick="window.open('${JIRA}${p.key}','_blank')">
        <td class="prog-title-cell" style="border-left-color:${ini.color}">
          <span style="display:flex;align-items:center;gap:0"><a href="${JIRA}${p.key}" target="_blank" onclick="event.stopPropagation()">${p.title}</a>${goalChip}</span>
          <span class="prog-key-sub">${p.key}</span>
        </td>
        <td>${prioBadge(p.priority)}</td>
        <td><span class="status-pill"><span class="sdot" style="background:${dotCol}"></span>${(STATUS_DOT[p.status]||["","Unknown"])[1]}</span></td>
        <td>${_fmtDue(p.due||'')}</td>
        <td style="font-size:11.5px;color:var(--g600)">${ownerFmt||'<em style="color:var(--g400)">Unassigned</em>'}</td>
      </tr>`;
    }).join('');
    return `
    <div class="prog-sp-group" style="border-top-color:${ini.color}">
      <div class="prog-sp-hd" onclick="toggleProgGroup(this.closest('.prog-sp-group'))">
        <button class="prog-toggle" onclick="event.stopPropagation();toggleProgGroup(this.closest('.prog-sp-group'))">▼</button>
        <span style="width:9px;height:9px;border-radius:50%;background:${ini.color};flex-shrink:0;display:inline-block"></span>
        <a href="${JIRA}${ini.key}" target="_blank" class="prog-sp-key" onclick="event.stopPropagation()">${ini.key}</a>
        <span class="prog-sp-title">${ini.title}</span>
        <span class="prog-sp-sub">— ${ini.sub||''}</span>
        <div class="prog-sp-stats">
          <span class="prog-sp-stat"><strong>${progs.length}</strong> programs</span>
          ${inFlight>0?`<span class="prog-sp-stat">· <strong>${inFlight}</strong> in-flight</span>`:''}
          ${blocked>0?`<span class="prog-sp-stat" style="color:var(--red)">· <strong>${blocked}</strong> blocked</span>`:''}
          ${badge(ini.status)}
        </div>
      </div>
      <div class="prog-table-wrap">
        <table class="prog-table">
          <thead><tr>
            <th class="prog-th" style="width:46%">Program / Epic</th>
            <th class="prog-th" style="width:7%">Priority</th>
            <th class="prog-th" style="width:13%">Status</th>
            <th class="prog-th" style="width:8%">Due</th>
            <th class="prog-th">Owner</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
  }).join('');

  const _pAll=(DATA.programs||[]);
  const _pIF=_pAll.filter(p=>p.status==='in-progress').length;
  const _pBl=_pAll.filter(p=>p.status==='blocked').length;
  const _pPl=_pAll.filter(p=>p.status==='planning'||p.status==='intake').length;
  const _pDo=_pAll.filter(p=>p.status==='done').length;
  const progStatStrip=`<strong>${_pAll.length}</strong> programs total &nbsp;·&nbsp; <strong style="color:var(--green)">${_pIF}</strong> in flight &nbsp;·&nbsp; <strong>${_pPl}</strong> planning${_pBl>0?` &nbsp;·&nbsp; <strong style="color:var(--red)">${_pBl} blocked</strong>`:''}${_pDo>0?` &nbsp;·&nbsp; ${_pDo} done`:''}`;

  document.getElementById('programs').innerHTML=`
    <div class="cmo-brief" style="border-left-color:var(--blue);margin-bottom:18px;padding:12px 18px 10px">
      <div class="cmo-brief-lbl">◈ Programs Overview · ${_todayFmt}</div>
      <div class="cmo-brief-txt" style="font-size:12.5px">${progStatStrip}</div>
    </div>
    <div class="sec-hd" style="margin-bottom:10px">
      <h2>Programs</h2>
      <p>Epics by Goal Area · click any row to open in Jira</p>
    </div>
    <div class="prog-filters">
      <span class="prog-filter-lbl">Team:</span>${spBtns}
    </div>
    <div class="prog-filters" style="margin-top:-12px">
      <span class="prog-filter-lbl">Priority:</span>${prioBtns}
      <span class="prog-vsep"></span>
      <span class="prog-filter-lbl">Quarter:</span>${qtrBtns}
    </div>
    <div class="prog-collapse-bar">
      <button class="prog-collapse-btn" onclick="expandAllProgs()">Expand All</button>
      <button class="prog-collapse-btn" onclick="collapseAllProgs()">Collapse All</button>
    </div>
    ${groups||`<div style="padding:40px;text-align:center;color:var(--g400)">No programs match the current filter</div>`}`;
}

function setProgFilter(w,v){
  if(w==='sp')ofSP=v; else if(w==='prio')ofPrio=v; else if(w==='qtr')ofQtr=v;
  document.getElementById('programs').innerHTML='';

}
function toggleProgGroup(grp){

function collapseAllProgs(){

function expandAllProgs(){
