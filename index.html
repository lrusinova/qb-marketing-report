}

/* ══════════════════════════════════════════════════════
   TAB 3 — DELIVERABLES
══════════════════════════════════════════════════════ */
function renderDeliverables(){
  const JIRA='https://quickbase.atlassian.net/browse/';

  // ── Normalisation ──────────────────────────────────────────────────────
  const _isSeo=t=>{if(!t)return false;const s=t.toLowerCase();
    return s.endsWith('glossary')||/^(the )?best\b/.test(s)||s.includes(' vs ')||
           /\buse case page/i.test(s)||/\bcomparison page/i.test(s)||/^top\b/.test(s)||
           s.includes('seo')||s.includes('aeo')||s.includes('entity cluster');};
  const _inferBU=i=>{if(i.bu&&i.bu!=='Unknown')return i.bu;
    const t=i.title||'';
    if(/^\[Pave\]/i.test(t)||/\bpaveathon\b/i.test(t))return 'Pave';
    if(/^\[FF\]/i.test(t)||/\bfastfield\b/i.test(t)||/\bfso\b/i.test(t)||/field service/i.test(t)||/smarter services/i.test(t))return 'FastField';
    if(/^\[Core\]/i.test(t))return 'QB-Core';
    if(/^\[Cross-BU\]/i.test(t)||/\bempower\b/i.test(t))return 'Cross-BU';
    if(i.ch==='Content & SEO'||i.ch==='Content'||i.ch==='SEO')return 'QB-Core';
    return 'Unknown';};
  // update-dashboard.js relabels some channels for display (e.g. "SEO / AEO", "Web / Digital")
  // — same alias map renderTeamsDashboard() uses, so a channel value valid there is valid here too.
  const CH_ALIAS={'SEO / AEO':'Content & SEO','Content':'Content & SEO',
    'Web / Digital':'Web & Digital','Launches & GTM':'PMM / Product',
    'Webinars & Events':'Events & Experiences','PR & Exec Comms':'PR & Comms',
    'Systems & AI':'Marketing Analytics','Paid Media':'Demand Gen'};
  const _norm=i=>{const ch0=CH_ALIAS[i.ch]||i.ch;
    return {...i,
      ch:ch0==='Content & SEO'?(_isSeo(i.title)?'SEO':'Content'):ch0,
      bu:_inferBU(i)};};

  // ── Color maps ─────────────────────────────────────────────────────────
  const CH_COLOR_MAP={'Content':'#0066D6','SEO':'#0891B2','Email & Lifecycle':'#14A558',
    'Creative & Design':'#DB2777','Demand Gen':'#F59E0B','Social Media':'#9333EA',
    'PMM / Product':'#7C3AED','Marketing Analytics':'#059669','Events & Experiences':'#E53935',
    'Community':'#D97706','PR & Comms':'#6366F1','Web & Digital':'#14B8A6','UX & Design':'#EC4899'};
  const _chFallback=['#0066D6','#7C3AED','#14A558','#DB2777','#F59E0B','#0891B2','#059669','#E53935'];
  let _chFbIdx=0;
  const chColMap={};
  const BU_COLS={'FastField':'#D97706','Pave':'#2C9382','QB-Core':'#10503C','Cross-BU':'#6d28d9'};

  // ── Build sources ──────────────────────────────────────────────────────
  const _planningSrc=(DATA.planning||[]).map(i=>({..._norm(i),_st:'planning'}));
  const _activeSrc=(DATA.active||[]).map(i=>({..._norm(i),_st:'in-progress'}));
  const _raw=delQtr==='Q2'?(DATA.q2deliverables||[]):DATA.shipped;
  const _shippedSrc=_raw.map(i=>({..._norm(i),_st:'done'}));
  const _allSrc=(()=>{const _seen=new Set();return[..._activeSrc,..._planningSrc,..._shippedSrc].filter(i=>_seen.has(i.key)?false:(_seen.add(i.key),true));})();
  _allSrc.forEach(i=>{if(i.ch&&!chColMap[i.ch])chColMap[i.ch]=CH_COLOR_MAP[i.ch]||_chFallback[_chFbIdx++%_chFallback.length];});

  // ── Owner helper ───────────────────────────────────────────────────────
  const _ownerFmt=n=>(!n||n==='(unassigned)'||n==='Unassigned')?null:(n.includes(', ')?n.split(', ').reverse().join(' '):n);

  // ── Time helpers ───────────────────────────────────────────────────────
  const _now=new Date();
  const _monStart=new Date(_now.getFullYear(),_now.getMonth(),1);
  const _wkStart=(()=>{const d=new Date(_now);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d;})();
  const _wkEnd=new Date(_wkStart);_wkEnd.setDate(_wkStart.getDate()+6);_wkEnd.setHours(23,59,59);
  const _todayStart=new Date(_now);_todayStart.setHours(0,0,0,0);
  const _todayEnd=new Date(_now);_todayEnd.setHours(23,59,59);
  const _qStart=new Date(_now.getFullYear(),Math.floor(_now.getMonth()/3)*3,1);
  const _qEnd=new Date(_now.getFullYear(),Math.floor(_now.getMonth()/3)*3+3,0,23,59);
  const parseD=s=>{if(!s)return null;const d=new Date(s);return isNaN(d)?null:d;};
  const inPeriod=(s,p)=>{
    const d=parseD(s);if(!d)return p==='All';
    if(p==='Today')return d>=_todayStart&&d<=_todayEnd;
    if(p==='Week')return d>=_wkStart&&d<=_wkEnd;
    if(p==='Month')return d>=_monStart&&d.getMonth()===_now.getMonth()&&d.getFullYear()===_now.getFullYear();
    if(p==='Quarter')return d>=_qStart&&d<=_qEnd;
    return true;};

  // ── Filter application ─────────────────────────────────────────────────
  const _matchOwner=i=>!ofOwner||ofOwner==='All'||(i.owner||'').toLowerCase().includes(ofOwner.toLowerCase());
  const _bf=i=>(ofBU==='All'||i.bu===ofBU)&&(ofCh==='All'||i.ch===ofCh)&&_matchOwner(i);

  const _stMap={'All':i=>true,'Planning':i=>i._st==='planning','Backlog / Intake':i=>i._st==='planning','In Progress':i=>i._st==='in-progress','Done':i=>i._st==='done'};
  const _stFn=_stMap[ofStatus]||_stMap['All'];

  const planItems=_planningSrc.filter(_bf);
  const activeItems=_activeSrc.filter(_bf);
  const doneItemsAll=_shippedSrc.filter(_bf).filter(i=>inPeriod(i.doneDate,ofPeriod));
  const allItems=_allSrc.filter(_bf).filter(i=>i._st==='planning'||i._st==='in-progress'||inPeriod(i.doneDate,ofPeriod)).filter(_stFn);
  const totalPages=Math.max(1,Math.ceil(allItems.length/50));
  if(delPage>totalPages)delPage=1;
  const pageItems=allItems.slice((delPage-1)*50,delPage*50);

  // ── Controls ───────────────────────────────────────────────────────────
  const stCnt={'All':allItems.length,'Planning':planItems.length,'Backlog / Intake':planItems.length,'In Progress':activeItems.length,'Done':doneItemsAll.length};
  const ST=[{k:'All',lbl:'All'},{k:'In Progress',lbl:'In Progress',dot:'#2C9382'},{k:'Planning',lbl:'Queued',dot:'#4361EE'},{k:'Done',lbl:'Shipped',dot:'#14A558'}];
  const seg=`<div class="dv-seg">${ST.map(s=>{const on=ofStatus===s.k;return`<button class="dv-seg-btn${on?' on':''}" onclick="setOF('status','${s.k}')" style="${on&&s.dot?`color:${s.dot}`:''}">${s.lbl}<span style="opacity:.65;font-size:10.5px;margin-left:3px">${stCnt[s.k]}</span></button>`;}).join('')}</div>`;

  const _owners=[...new Set(_allSrc.map(i=>i.owner).filter(o=>o&&o!=='(unassigned)'&&o!=='Unassigned'))].sort((a,b)=>(_ownerFmt(a)||a).localeCompare(_ownerFmt(b)||b));
  const ownerDrop=`<select class="dv-drop${ofOwner&&ofOwner!=='All'?' active':''}" onchange="setOF('owner',this.value)"><option value="All"${!ofOwner||ofOwner==='All'?' selected':''}>👤 All people</option>${_owners.map(n=>`<option value="${n}"${ofOwner===n?' selected':''}>${_ownerFmt(n)||n}</option>`).join('')}</select>`;

  const _buCnt={};allItems.forEach(i=>_buCnt[i.bu]=(_buCnt[i.bu]||0)+1);
  const buDrop=`<select class="dv-drop${ofBU!=='All'?' active':''}" onchange="setOF('bu',this.value)"><option value="All"${ofBU==='All'?' selected':''}>BU: All</option>${['FastField','Pave','QB-Core','Cross-BU'].map(b=>`<option value="${b}"${ofBU===b?' selected':''}>${b} (${_buCnt[b]||0})</option>`).join('')}</select>`;

  const _chTotals={};_allSrc.forEach(i=>{if(i.ch)_chTotals[i.ch]=(_chTotals[i.ch]||0)+1;});
  const _chCnt={};allItems.forEach(i=>{if(i.ch)_chCnt[i.ch]=(_chCnt[i.ch]||0)+1;});
  const chDrop=`<select class="dv-drop${ofCh!=='All'?' active':''}" onchange="setOF('ch',this.value)"><option value="All"${ofCh==='All'?' selected':''}>Channel: All</option>${Object.keys(_chTotals).sort((a,b)=>(_chTotals[b]||0)-(_chTotals[a]||0)).map(ch=>`<option value="${ch}"${ofCh===ch?' selected':''}>${ch} (${_chCnt[ch]||0})</option>`).join('')}</select>`;

  const qtrCtrl=(ofStatus==='Planning'||ofStatus==='In Progress')?'':
    `<div class="dv-qtr"><button class="dv-qtr-btn${delQtr==='Q3'?' on':''}" onclick="setDelQtr('Q3')">Q3 2026</button><button class="dv-qtr-btn${delQtr==='Q2'?' on':''}" onclick="setDelQtr('Q2')">Q2 2026</button></div>`;

  const PERIODS=[{k:'All',lbl:'All'},{k:'Month',lbl:'This Month'},{k:'Week',lbl:'This Week'},{k:'Today',lbl:'Today'}];
  const periodCtrl=(ofStatus==='Planning'||ofStatus==='In Progress'||delQtr==='Q2')?'':
    `<div class="dv-qtr">${PERIODS.map(p=>`<button class="dv-qtr-btn${ofPeriod===p.k?' on':''}" onclick="setOF('period','${p.k}')">${p.lbl}</button>`).join('')}</div>`;

  // ── Row builder ────────────────────────────────────────────────────────
  const _avPalette=['#0066D6','#7C3AED','#14A558','#DB2777','#F59E0B','#0891B2','#059669','#E53935','#D97706','#6366F1'];
  const _avColor=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%_avPalette.length;return _avPalette[h];};
  const _initials=n=>n.split(' ').slice(0,2).map(w=>w[0]||'').join('').toUpperCase();
  const ST_DOT={planning:'#4361EE','in-progress':'#2C9382',done:'#14A558'};
  const ST_LBL={planning:'Backlog / Intake','in-progress':'In Progress',done:'Done'};
  const buTag=i=>{const c=BU_COLS[i.bu];return c?`<span class="dv-bu" style="background:${c}18;color:${c};border:1px solid ${c}30">${i.bu.replace(' (QB)','')}</span>`:''};

  const _row=i=>{
    const col=chColMap[i.ch]||'#94a3b8';
    const ownerFmt=_ownerFmt(i.owner);
    const dot=ST_DOT[i._st]||'#94a3b8';
    const dateStr=i._st==='done'?(i.doneDate||''):'';
    const dateFmt=dateStr.replace(/, 2026$/,'').replace(/, 2025$/," '25");
    const datePfx='Done';
    return`<div class="dv-row" onclick="window.open('${JIRA}${i.key}','_blank')">
      <span class="dv-st-dot" style="background:${dot}" title="${ST_LBL[i._st]||''}"></span>
      <div class="dv-title-area">
        <a class="dv-title" href="${JIRA}${i.key}" target="_blank" onclick="event.stopPropagation()">${i.title}</a>
        <div class="dv-key">${i.key}</div>
      </div>
      <div class="dv-meta-own">
        ${ownerFmt?`<span class="dv-av" style="background:${_avColor(ownerFmt)}" title="${ownerFmt}">${_initials(ownerFmt)}</span><span class="dv-owner">${ownerFmt}</span>`:'<span style="font-size:11px;color:var(--g300)">—</span>'}
      </div>
      <span class="dv-ch" style="background:${col}18;color:${col}">${i.ch||'—'}</span>
      <span class="dv-bu-cell">${buTag(i)}</span>
      ${dateFmt?`<span class="dv-date"><span class="dv-date-pfx">${datePfx}</span>${dateFmt}</span>`:'<span class="dv-date"></span>'}
    </div>`;};

  // ── Feed ───────────────────────────────────────────────────────────────
  let feedHtml='';
  if(pageItems.length){
    let curSt=null;
    feedHtml=pageItems.map(i=>{
      let hd='';
      if(ofStatus==='All'&&i._st!==curSt){
        curSt=i._st;
        const secCounts={planning:planItems.length,'in-progress':activeItems.length,done:doneItemsAll.length};
        hd=`<div class="dv-sec-hd" style="color:${ST_DOT[i._st]||'var(--g500)'}"><span>${ST_LBL[i._st]||i._st}</span><span class="dv-sec-cnt">${secCounts[i._st]||0} total</span></div>`;
      }
      return hd+_row(i);
    }).join('');
  }

  // ── Assemble ───────────────────────────────────────────────────────────
  const _anyFilter=ofBU!=='All'||ofCh!=='All'||ofPeriod!=='All'||ofStatus!=='All'||(ofOwner&&ofOwner!=='All');
  const clrLink=`<a href="#" onclick="event.preventDefault();ofBU=ofCh='All';ofPeriod='All';ofStatus='All';ofOwner='All';delPage=1;renderDeliverables()" style="font-size:11.5px;color:var(--blue);font-weight:600">Clear all ×</a>`;
  const summaryParts=[];
  if(_planningSrc.length)summaryParts.push(`<strong>${planItems.length}</strong> queued`);
  if(_activeSrc.length)summaryParts.push(`<strong>${activeItems.length}</strong> in progress`);
  summaryParts.push(`<strong>${doneItemsAll.length}</strong> shipped`);
  const pgCtrl=totalPages>1?`<div class="dv-pg"><button class="dv-pg-btn" onclick="setDelPage(${delPage-1})" ${delPage<=1?'disabled':''}>← Prev</button><span style="font-size:12.5px">Page <strong>${delPage}</strong> of <strong>${totalPages}</strong> &nbsp;·&nbsp; ${allItems.length} items</span><button class="dv-pg-btn" onclick="setDelPage(${delPage+1})" ${delPage>=totalPages?'disabled':''}>Next →</button></div>`:'';

  document.getElementById('deliverables').innerHTML=`
    <div style="max-width:980px;margin:0 auto">
    <div class="sec-hd del3-summary" style="margin-bottom:12px"><h2>Deliverables</h2><p>${summaryParts.join(' · ')}${_anyFilter?` &nbsp;${clrLink}`:''}</p></div>
    <div class="dv-ctrl">
      ${seg}
      ${buDrop}
      ${ownerDrop}
      ${chDrop}
      ${qtrCtrl}
      ${periodCtrl}
      <div class="dv-search-wrap"><span class="dv-search-icon">⌕</span><input id="del-title-input" type="text" class="dv-search" placeholder="Search by title…" oninput="applyDelFilters()"></div>
    </div>
    ${allItems.length
      ?`<div class="dv-list" id="del3-feed">${feedHtml}</div>${pgCtrl}`
      :`<div class="dv-empty"><div style="font-size:28px;margin-bottom:10px">📋</div><div style="font-size:14px;font-weight:700;color:var(--navy);margin-bottom:6px">No items found</div><div style="font-size:13px;color:var(--g500)">${_anyFilter?`Try adjusting your filters &nbsp;—&nbsp; ${clrLink}`:'No deliverables loaded yet.'}</div></div>`}
    </div>`;
}

function setDelQtr(q){delQtr=q;ofBU='All';ofCh='All';ofLbl='All';ofPeriod='All';ofStatus='All';ofOwner='All';delPage=1;document.getElementById('deliverables').innerHTML='';renderDeliverables();}
function setDelPage(n){delPage=n;document.getElementById('deliverables').innerHTML='';renderDeliverables();}
function setOF(w,v){
  if(w==='bu')ofBU=v; else if(w==='ch')ofCh=v; else if(w==='lbl')ofLbl=v; else if(w==='period')ofPeriod=v; else if(w==='status')ofStatus=v; else if(w==='owner')ofOwner=v;
  delPage=1;
  document.getElementById('deliverables').innerHTML='';
  renderDeliverables();
}
function pickCh(i){const n=window._chNames[i];setOF('ch',ofCh===n?'All':n);}
// Jump from a Teams Dashboard number/chip straight into a pre-filtered Deliverables list,
// in-app, instead of leaving to an external Jira search. Pass 'All' (or omit) to leave a
// given filter untouched — e.g. jumpToDeliverables('SEO') only sets the channel.
function jumpToDeliverables(ch,bu,status){
  if(ch!==undefined)ofCh=ch;
  if(bu!==undefined)ofBU=bu;
  if(status!==undefined)ofStatus=status;
  ofOwner='All';ofPeriod='All';ofLbl='All';delPage=1;
  document.querySelectorAll('.pane').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.tbtn').forEach(b=>b.classList.remove('on'));
  document.getElementById('deliverables').classList.add('on');
  const btn=Array.from(document.querySelectorAll('.tbtn')).find(b=>b.textContent.includes('Deliverables'));
  if(btn)btn.classList.add('on');
  document.getElementById('deliverables').innerHTML='';
  renderDeliverables();
  window.scrollTo({top:0,behavior:'instant'});
}
function applyDelFilters(){
  const titleTerm=((document.getElementById('del-title-input')||{}).value||'').toLowerCase().trim();
  document.querySelectorAll('#del3-feed .dv-row').forEach(r=>{
    const txt=(r.querySelector('.dv-title')||{}).textContent?.toLowerCase()||'';
    r.style.display=(!titleTerm||txt.includes(titleTerm))?'':'none';
  });
  document.querySelectorAll('#del3-feed .dv-sec-hd').forEach(hd=>{
    let sib=hd.nextElementSibling;let hasVis=false;
    while(sib&&!sib.classList.contains('dv-sec-hd')){if(sib.style.display!=='none')hasVis=true;sib=sib.nextElementSibling;}
    hd.style.display=hasVis?'':'none';
  });
}
function filterDelSearch(term){applyDelFilters();}

/* ══════════════════════════════════════════════════════
   TAB 4 — ANALYTICS
══════════════════════════════════════════════════════ */
function renderAnalytics(){
  const inits=DATA.initiatives;
  const totalDone=inits.reduce((s,i)=>s+i.done,0);
  const totalItems=inits.reduce((s,i)=>s+i.total,0);
  const q2Actual=Math.round(totalDone/totalItems*100);
  const q2Expected=100; // Q2 complete — show final vs target
  const paceDiff=q2Actual-q2Expected;

  // Chart 1: Initiative bars
  const barH=22,gap=13,labelW=190,barW=290;
  const svgH=inits.length*(barH+gap)+10;
  const shortT=t=>t.replace('Corporate ','').replace('Marketing Systems','Systems').replace('Program Management','PM');
  const bars1=inits.map((ini,i)=>{const y=i*(barH+gap);const bw=Math.round(ini.pct/100*barW);return `
    <rect x="${labelW}" y="${y}" width="${barW}" height="${barH}" rx="5" fill="#F1F5F9"/>
    <rect x="${labelW}" y="${y}" width="${bw||3}" height="${barH}" rx="5" fill="${ini.color}" opacity=".85"/>
    <text x="${labelW-10}" y="${y+15}" text-anchor="end" font-size="11" fill="#475569" font-weight="600">${shortT(ini.title)}</text>
    <text x="${labelW+bw+8}" y="${y+15}" font-size="12" font-weight="800" fill="${ini.color}">${ini.pct}%</text>`;
  }).join('');

  // Chart 2: Channel donut
  const cc={};DATA.shipped.forEach(i=>{cc[i.ch]=(cc[i.ch]||0)+1;});
  const ct=Object.values(cc).reduce((s,v)=>s+v,0);
  const ce=Object.entries(cc).sort((a,b)=>b[1]-a[1]);
  let cum=0;
  const slices=ce.map(([ch,n])=>{
    const pct=Math.round(n/ct*100),col=CH_COLORS[ch]||'#94A3B8';
    const s=`<circle cx="18" cy="18" r="15.9155" fill="none" stroke="${col}" stroke-width="4.5" stroke-dasharray="${pct} ${100-pct}" stroke-dashoffset="${100-cum+25}" style="transform:rotate(-90deg);transform-origin:50% 50%"/>`;
    cum+=pct;return {s,ch,n,pct,col};
  });
  const legend2=slices.map(s=>`<div style="display:flex;align-items:center;gap:8px;margin-bottom:7px">
    <div style="width:9px;height:9px;border-radius:50%;background:${s.col};flex-shrink:0"></div>
    <span style="font-size:12px;color:var(--g700);flex:1">${s.ch}</span>
    <span style="font-size:12px;font-weight:800">${s.n}</span>
    <span style="font-size:10px;color:var(--g400);width:28px;text-align:right">${s.pct}%</span>
  </div>`).join('');
  const chart2=`<div style="display:flex;align-items:flex-start;gap:24px">
    <svg width="140" height="140" viewBox="0 0 36 36" style="flex-shrink:0;filter:drop-shadow(0 4px 12px rgba(0,40,85,.1))">
      <circle cx="18" cy="18" r="15.9155" fill="none" stroke="#F1F5F9" stroke-width="4"/>

        +'<span style="flex:1;font-weight:600;color:var(--g700)">'+ch+'</span>'
        +'<span style="color:var(--g500)">'+hrs+'h</span>'
        +(delta!==0?'<span class="trend-delta" style="background:'+(delta>0?'rgba(229,57,53,.1)':'rgba(20,165,88,.1)')+';color:'+(delta>0?'var(--red)':'var(--green)')+'">'+(delta>0?'+':'')+delta+'h</span>':'')
        +(changed?'<span class="trend-badge" style="background:rgba(245,158,11,.12);color:#92400E">'+pload+'&rarr;'+load+'</span>':'')
        +'</div>';
    }).join('');
    return '<div class="an-card an-full" style="border-top:3px solid var(--qb-teal);margin-bottom:16px">'
      +'<div class="an-hd">Capacity Trend &mdash; '+n+' weeks</div>'
      +'<div class="an-sub">'+HISTORY[0].w+' &rarr; '+latest.w+'</div>'
      +'<div class="an-kpi-row" style="grid-template-columns:repeat(4,1fr);margin-bottom:20px">'
      +'<div class="an-kpi" style="border-top:3px solid var(--red)"><div class="an-kpi-n" style="color:var(--red)">'+latest.ov+'</div><span class="an-kpi-l">Over capacity</span><div class="an-kpi-sub">'+(ovDelta===0?'No change':deltaStr(ovDelta,true)+' vs last week')+'</div></div>'
      +'<div class="an-kpi" style="border-top:3px solid var(--amber)"><div class="an-kpi-n" style="color:#92400E">'+latest.hi+'</div><span class="an-kpi-l">High load</span><div class="an-kpi-sub">'+(hiDelta===0?'No change':deltaStr(hiDelta,true)+' vs last week')+'</div></div>'
      +'<div class="an-kpi" style="border-top:3px solid var(--green)"><div class="an-kpi-n" style="color:var(--green)">'+latest.ok+'</div><span class="an-kpi-l">Healthy</span><div class="an-kpi-sub">'+(latest.ok-prev.ok===0?'No change':deltaStr(latest.ok-prev.ok,false)+' vs last week')+'</div></div>'
      +'<div class="an-kpi" style="border-top:3px solid var(--g300)"><div class="an-kpi-n">'+latest.lt+'</div><span class="an-kpi-l">Light load</span><div class="an-kpi-sub">'+(latest.lt-prev.lt===0?'No change':deltaStr(latest.lt-prev.lt,false)+' vs last week')+'</div></div>'
      +'</div>'
      +'<svg width="100%" viewBox="0 0 '+CW+' '+CH+'" style="display:block;overflow:visible;margin-bottom:4px">'
      +yGrid(0)+yGrid(Math.round(maxY/2))+yGrid(maxY)
      +yLbls
      +'<polyline points="'+hiPts+'" fill="none" stroke="var(--amber)" stroke-width="2" stroke-dasharray="5,3" opacity=".7"/>'
      +'<polyline points="'+ovPts+'" fill="none" stroke="var(--red)" stroke-width="2.5"/>'
      +dots
      +'</svg>'
      +'<div class="trend-legend"><span><i style="background:var(--red)"></i>Over capacity</span><span><i style="background:var(--amber)"></i>High load (dashed)</span></div>'
      +'<div style="font-size:12px;font-weight:800;color:var(--g500);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Channel delta &mdash; vs prev week</div>'
      +'<div style="columns:2;gap:24px">'+chComp+'</div>'
      +'</div>';
  })();

  document.getElementById('analytics').innerHTML=`
    <div class="sec-hd"><h2>Analytics</h2><p>Updated ${DATA.lastUpdated}</p></div>

    <div style="background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:9px 14px;margin-bottom:18px;font-size:12px;color:#78350f;line-height:1.5">
      📋 <strong>Planned workload view</strong> — tasks assigned in Jira (To Do, Planning, In Progress). A full queue means work is lined up and in progress, not that anything is overdue.
    </div>

    ${capHtml}

    ${_trendHtml}

    `;
}

/* ══════════════════════════════════════════════════════
   TEAMS DASHBOARD — one tailored widget per channel
══════════════════════════════════════════════════════ */
function renderTeamsDashboard(){
  const CH_COLOR={'Content':'#0066D6','SEO':'#0891B2','Email & Lifecycle':'#14A558','Creative & Design':'#DB2777',
    'Demand Gen':'#F59E0B','Social Media':'#9333EA','PMM / Product':'#7C3AED','Marketing Analytics':'#059669',
    'Events & Experiences':'#E53935','Community':'#D97706','PR & Comms':'#6366F1','Web & Digital':'#14B8A6','UX & Design':'#EC4899'};
  // Same title-pattern heuristic renderDeliverables()/renderAnalytics() already use to split the
  // combined "Content & SEO" Jira channel into Content vs SEO sub-buckets for their own views.
  const _isSeo=title=>{const s=(title||'').toLowerCase();
    return s.endsWith('glossary')||/^(the )?best\b/.test(s)||s.includes(' vs ')||
      /\buse case page/i.test(s)||/\bcomparison page/i.test(s)||/^top\b/.test(s)||
      s.includes('seo')||s.includes('aeo')||s.includes('entity cluster');};
  // update-dashboard.js relabels some channels for display in shipped/planning/active items
  // (e.g. "SEO / AEO", "Web / Digital") — normalize back to the 12 canonical CAP_DATA channel names.
  const CH_ALIAS={'SEO / AEO':'Content & SEO','Content':'Content & SEO',
    'Web / Digital':'Web & Digital','Launches & GTM':'PMM / Product',
    'Webinars & Events':'Events & Experiences','PR & Exec Comms':'PR & Comms',
    'Systems & AI':'Marketing Analytics','Paid Media':'Demand Gen'};
  const _norm=ch=>CH_ALIAS[ch]||ch;
  // SEO's BU headers still deep-link to an external Jira search (parent in <epic keys>) since
  // that's more precise than Deliverables' filters can express; everything else jumps in-app.
  const _jqlUrl=jql=>'https://quickbase.atlassian.net/issues/?jql='+encodeURIComponent(jql);
  const _all=[
    ...(DATA.planning||[]).map(i=>({...i,ch:_norm(i.ch),_st:'planning'})),
    ...(DATA.active  ||[]).map(i=>({...i,ch:_norm(i.ch),_st:'active'})),
    ...(DATA.shipped ||[]).map(i=>({...i,ch:_norm(i.ch),_st:'done'})),
  ];
  const byCh=ch=>_all.filter(i=>i.ch===ch);
  // Content & SEO render as two separate widgets; both draw from the same combined channel pool,
  // split by _isSeo() rather than a Jira field (Content & SEO is one team/channel in Jira).
  const itemsForWidget=c=>{
    if(c.ch==='Content')return byCh('Content & SEO').filter(i=>!_isSeo(i.title));
    if(c.ch==='SEO')return byCh('Content & SEO').filter(i=>_isSeo(i.title));
    return byCh(c.ch);
  };
  // SEO's wide card must come BEFORE Content in the flow, not after — a full-width card
  // breaks the row, and if it follows Content, Content is left alone with an empty gap
  // beside it. Leading with SEO means the remaining 12 regular cards (a multiple of 3)
  // pack into clean, even rows with nothing orphaned.
  const _expandChannels=channels=>channels.flatMap(c=>c.ch==='Content & SEO'
    ?[{...c,ch:'SEO'},{...c,ch:'Content'}]
    :[c]);
  // Pipeline — Briefed (planning) → In progress (active) → Published (done): the universal
  // first block on every widget. These are Jira statusCategory buckets (already fetched),
  // NOT a dedicated "brief submitted" tracker.
  const _PIPE_COLOR={planning:'#4361EE',active:'#2C9382',done:'#14A558'};
  const _PIPE_LABEL={planning:'Briefed',active:'In progress',done:'Published'};
  const _PIPE_ICON={planning:'📋',active:'⚙️',done:'✅'};
  // Deep-links now jump in-app to a pre-filtered Deliverables view (jumpToDeliverables, wired
  // near setOF()) instead of opening an external Jira search — same channel names and BU values
  // (QB-Core/FastField/Pave/Cross-BU) that Deliverables' own filters already use.
  const _STATUS_FOR_DEL={planning:'Planning',active:'In Progress',done:'Done'};
  const _pipelineFromCounts=(counts,labels,ch)=>{
    const lbl=labels||_PIPE_LABEL;
    return '<div class="tw-pipe-row">'+['planning','active','done'].map((st,i)=>{
      const inner='<div class="tw-pipe-icon">'+_PIPE_ICON[st]+'</div>'
        +'<div class="tw-pipe-n" style="color:'+_PIPE_COLOR[st]+'">'+(counts[st]||0)+'</div><div class="tw-pipe-l">'+lbl[st]+'</div>';
      const stage=ch
        ?'<a class="tw-pipe-stage" style="background:'+_PIPE_COLOR[st]+'0d" href="#" title="View in Deliverables" onclick="jumpToDeliverables(\''+ch+'\',\'All\',\''+_STATUS_FOR_DEL[st]+'\');return false;">'+inner+'</a>'
        :'<div class="tw-pipe-stage" style="background:'+_PIPE_COLOR[st]+'0d">'+inner+'</div>';
      return (i>0?'<span class="tw-pipe-arrow">&rarr;</span>':'')+stage;
    }).join('')+'</div>';
  };
  const _pipelineHtml=(items,ch)=>{
    const counts={planning:0,active:0,done:0};
    items.forEach(i=>{counts[i._st]=(counts[i._st]||0)+1;});
    return _pipelineFromCounts(counts,null,ch);
  };
  // Part-to-whole as ONE segmented strip (sequential: one hue, opacity-ranked) + a chip legend,
  // instead of a stack of near-identical horizontal bar rows.
  const _SEG_OPACITY=[1,.72,.5,.34];
  const _segBarHtml=(pairs,col,ch)=>{
    const bar=pairs.map(([label,n],i)=>
      '<div class="tw-seg" style="flex:'+n+' '+n+' 0%;background:'+col+';opacity:'+(_SEG_OPACITY[i]||.25)+'" title="'+label+': '+n+'"></div>').join('');
    const legend=pairs.map(([label,n],i)=>{
      const inner='<span class="tw-seg-chip-dot" style="background:'+col+';opacity:'+(_SEG_OPACITY[i]||.25)+'"></span>'+label+' <b>'+n+'</b>';
      return ch
        ?'<a class="tw-seg-chip" href="#" title="View in Deliverables" onclick="jumpToDeliverables(\''+ch+'\',\''+label+'\',\'All\');return false;">'+inner+'</a>'
        :'<span class="tw-seg-chip">'+inner+'</span>';
    }).join('');
    return '<div class="tw-seg-wrap"><div class="tw-seg-bar">'+bar+'</div><div class="tw-seg-legend">'+legend+'</div></div>';
  };
  const _buSegHtml=(items,col,ch)=>{
    const bu={};items.forEach(i=>{const b=i.bu||'Unknown';bu[b]=(bu[b]||0)+1;});
    const pairs=Object.entries(bu).sort((a,b)=>b[1]-a[1]).slice(0,4);
    return pairs.length?_segBarHtml(pairs,col,ch):'<div class="tw-foot">No BU-tagged items</div>';
  };
  // Meter — a single ratio against a whole (e.g. Content's share of the combined Content+SEO team's work).
  const _meterHtml=(pct,col,label)=>
    '<div class="tw-meter-wrap"><div class="tw-meter-lbl"><span>'+label+'</span><b>'+pct+'%</b></div>'
    +'<div class="tw-meter-track"><div class="tw-meter-fill" style="width:'+pct+'%;background:'+col+'"></div></div></div>';
  const _contentSeoShare=(items,col,label)=>{
    const combinedTotal=byCh('Content & SEO').length||1;
    const pct=Math.round(items.length/combinedTotal*100);
    return _meterHtml(pct,col,label);
  };

  // ── every widget: pipeline, then BU split (answers "divide by business unit" universally) ──
  const _contentSignal=(items,col,ch)=>
    _pipelineHtml(items,ch)
    +_contentSeoShare(items,col,'Share of Content + SEO capacity')
    +_buSegHtml(items,col,ch);
  const _signalFor=(c,items)=>{
    const col=CH_COLOR[c.ch]||'#64748B';
    if(c.ch==='Content')return _contentSignal(items,col,c.ch);
    return _pipelineHtml(items,c.ch)+_buSegHtml(items,col,c.ch);
  };
  const CH_ICON={'Content':'📝','SEO':'🔍','Email & Lifecycle':'✉️','Creative & Design':'🎨',
    'Demand Gen':'📣','Social Media':'💬','PMM / Product':'🚀','Marketing Analytics':'📊',
    'Events & Experiences':'🎪','Community':'🤝','PR & Comms':'📰','Web & Digital':'🖥️','UX & Design':'✏️'};
  const _LBADGE={
    'OVER':{label:'Full queue', bg:'rgba(245,158,11,.12)',color:'#92400E'},
    'HIGH':{label:'High load',  bg:'rgba(245,158,11,.08)',color:'#92400E'},
    'OK':  {label:'Healthy',    bg:'rgba(20,165,88,.1)',  color:'var(--green)'},
    'LIGHT':{label:'Light load',bg:'var(--g100)',         color:'var(--g500)'},
    'GAP': {label:'No data',    bg:'var(--g100)',         color:'var(--g400)'},
  };

  // ── attention (blocked/overdue) + in-flight-now, from real Jira status/duedate/priority ──
  // Only present on items pulled through the updated categorizeIssues() in update-dashboard.js —
  // guarded by hasAttentionData below so stale pre-refresh data doesn't render a false "all clear".
  const hasAttentionData=[...(DATA.planning||[]),...(DATA.active||[])].some(i=>i.blocked!==undefined||i.due!==undefined);
  const _today=new Date();_today.setHours(0,0,0,0);
  const _isOverdue=i=>!!i.due&&new Date(i.due+'T12:00:00')<_today;
  const _attentionFor=items=>{
    const openItems=items.filter(i=>i._st!=='done');
    const blockedItems=openItems.filter(i=>i.blocked);
    const overdueItems=openItems.filter(i=>!i.blocked&&_isOverdue(i)).sort((a,b)=>new Date(a.due)-new Date(b.due));
    return {blockedItems,overdueItems};
  };
  // Numbers only, not item titles — the underlying data repeats the same title across
  // several tickets often enough (subtask/parent overlap) that a "top 3" title list reads
  // as a bug. Chips/counts are reliable even when the individual titles aren't.
  const _attnHtml=(blockedItems,overdueItems)=>{
    if(!blockedItems.length&&!overdueItems.length)return '<div class="tw-attn-clean">✓ Nothing blocked or overdue</div>';
    let out='<div class="tw-attn-row">';
    if(blockedItems.length)out+='<span class="tw-attn-chip blocked">⛔ '+blockedItems.length+' blocked</span>';
    if(overdueItems.length)out+='<span class="tw-attn-chip overdue">⏰ '+overdueItems.length+' overdue</span>';
    out+='</div>';
    return out;
  };

  // ── SEO Content Program spotlight — pulled directly from Jira (parent in <the 11 SEO epics>),
  // NOT derived from the client-side heuristic/DATA-array split used by every other widget.
  // Content stage = Content Request status (idea → Briefed → Drafting → In review → Written).
  // Web publish stage = the separate Web Page Request ticket's own status (Briefed → QA → Live).
  // Re-pull manually (or via update-dashboard.js once it can reach Jira) to refresh these counts.
  const SEO_PIPELINE={
    pulledAt:'Aug 14, 2026',
    epicCount:11,
    byBU:{
      FastField:{content:{idea:14,brief:0,drafting:0,review:0,done:0},blocked:0,web:{brief:0,qa:0,live:0}},
      Pave:     {content:{idea:0, brief:0,drafting:0,review:0,done:22},blocked:1,web:{brief:10,qa:4,live:6}},
      Core:     {content:{idea:8, brief:8,drafting:4,review:8,done:0}, blocked:1,web:{brief:0,qa:0,live:0}},
    },
  };
  const _SEO_BU_COLOR={FastField:'#D97706',Pave:'#2C9382',Core:'#10503C'};
  // The exact SEO-labeled epics per BU, from the same live Jira pull as SEO_PIPELINE — lets the
  // BU header link straight to "everything under this BU's content clusters" in Jira.
  const SEO_BU_EPICS={
    FastField:['MKT-13305','MKT-13212'],
    Pave:['MKT-13065','MKT-12120','MKT-12119','MKT-12118','MKT-12117','MKT-12116','MKT-12115'],
    Core:['MKT-12940','MKT-13253'],
  };
  const _seoMiniStrip=(stages,col)=>{
    const total=stages.reduce((s,p)=>s+p[1],0);
    if(!total)return '<div class="tw-spot-empty">Nothing here yet</div>';
    // Stages are in fixed pipeline order (not size-ranked), so opacity is a progress
    // gradient — later stage = further along = fuller color — not a size ranking.
    const n=stages.length;
    const bar=stages.map(([label,cnt],i)=>cnt?'<div class="tw-spot-mini-seg" style="flex:'+cnt+' '+cnt+' 0%;background:'+col+';opacity:'+(0.35+0.65*(n>1?i/(n-1):1))+'" title="'+label+': '+cnt+'"></div>':'').join('');
    const legend=stages.filter(([,cnt])=>cnt>0).map(([label,cnt])=>label+' <b>'+cnt+'</b>').join(' &middot; ');
    return '<div class="tw-spot-mini-row">'+bar+'</div><div class="tw-spot-mini-legend">'+legend+'</div>';
  };
  const _seoBuCard=(buName,data)=>{
    const c=data.content;
    const contentStages=[['Idea',c.idea],['Briefed',c.brief],['Drafting',c.drafting],['In review',c.review],['Written',c.done]];
    const webStages=[['Briefed',data.web.brief],['QA',data.web.qa],['Live',data.web.live]];
    const total=contentStages.reduce((s,p)=>s+p[1],0)+(data.blocked||0);
    const col=_SEO_BU_COLOR[buName]||'#64748B';
    const blockedChip=data.blocked?'<div style="margin-top:6px"><span class="tw-attn-chip blocked">⛔ '+data.blocked+' blocked</span></div>':'';
    const epics=SEO_BU_EPICS[buName]||[];
    const buNameHtml=epics.length
      ?'<a class="tw-spot-bu-name" style="color:'+col+'" target="_blank" rel="noopener" title="Open in Jira" href="'+_jqlUrl('parent in ('+epics.join(',')+')')+'">'+buName+'</a>'
      :'<span class="tw-spot-bu-name" style="color:'+col+'">'+buName+'</span>';
    return '<div class="tw-spot-bu" style="border-top:3px solid '+col+'">'
      +'<div class="tw-spot-bu-hd">'+buNameHtml+'<span class="tw-spot-bu-total">'+total+' pages</span></div>'
      +'<div class="tw-spot-lbl">Content &mdash; written by Content team</div>'
      +_seoMiniStrip(contentStages,col)
      +'<div class="tw-spot-lbl">Web publish &mdash; built by Web team</div>'
      +_seoMiniStrip(webStages,col)
      +blockedChip
      +'</div>';
  };
  const _card=(c,idx)=>{
    const lb=_LBADGE[c.load]||_LBADGE.GAP;
    const col=CH_COLOR[c.ch]||'#64748B';
    const delayStyle='animation-delay:'+Math.min(idx||0,10)*45+'ms;';
    // SEO lives in the same grid as everyone else — it's just wide, because there's a lot of
    // real Jira-pulled ground to cover (cross-team: SEO scopes → Content writes → Web publishes).
    if(c.ch==='SEO'){
      return '<div class="tw-card tw-card-wide" style="--tw-accent:'+col+';'+delayStyle+'">'
        +'<div class="tw-card-hd"><span class="tw-card-title"><span class="tw-icon">'+CH_ICON.SEO+'</span>SEO</span>'
        +'<span class="tw-badge" style="background:'+lb.bg+';color:'+lb.color+'">'+lb.label+'</span></div>'
        +'<div class="tw-spot-sub">Content Pipeline &mdash; SEO (Tom South/Tony Ruiz) scopes '+SEO_PIPELINE.epicCount+' content clusters across FastField/Pave/Core, Content (Nathan Wahl\'s team) writes each page, then Web publishes it via its own ticket.'
        +' <span class="tw-spot-pulled">Pulled directly from Jira &middot; '+SEO_PIPELINE.pulledAt+'</span></div>'
        +'<div class="tw-spot-bu-row">'+Object.keys(SEO_PIPELINE.byBU).map(bu=>_seoBuCard(bu,SEO_PIPELINE.byBU[bu])).join('')+'</div>'
        +'<div class="tw-signal-lbl">'+c.hours+'h team capacity <span style="color:var(--g400)">(shared w/ Content)</span></div>'
        +'</div>';
    }
    const items=itemsForWidget(c);
    const {blockedItems,overdueItems}=_attentionFor(items);
    const attnBlock=hasAttentionData?_attnHtml(blockedItems,overdueItems):'';
    const divider=attnBlock?'<div class="tw-divider"></div>':'';
    // Content shares its Jira channel/team's capacity with SEO (hours/load can't be split without
    // per-item hour data), so this caption flags it as shared rather than showing a fabricated split.
    const capLine=c.ch==='Content'
      ?c.hours+'h team capacity <span style="color:var(--g400)">(shared w/ SEO)</span>'
      :c.hours+'h estimated capacity';
    return '<div class="tw-card" style="--tw-accent:'+col+';'+delayStyle+'">'
      +'<div class="tw-card-hd"><span class="tw-card-title"><span class="tw-icon">'+(CH_ICON[c.ch]||'📌')+'</span>'+c.ch+'</span>'
      +'<span class="tw-badge" style="background:'+lb.bg+';color:'+lb.color+'">'+lb.label+'</span></div>'
      +attnBlock
      +divider
      +_signalFor(c,items)
      +'<div class="tw-signal-lbl">'+capLine+'</div>'
      +'</div>';
  };
  const noDataBanner=hasAttentionData?'':'<div class="tw-nodata-banner">⏳ Blocked/overdue/priority signal will populate after the next Jira sync — showing capacity and pipeline stage only for now.</div>';
  const _tcSh={'Content & SEO':'Content+SEO','Email & Lifecycle':'Email','Creative & Design':'Creative','Demand Gen':'DG','Social Media':'Social','PMM / Product':'PMM','Marketing Analytics':'Analytics','Events & Experiences':'Events','Community':'Community','PR & Comms':'PR & Comms','Web & Digital':'Web','UX & Design':'UX'};
  const _tcCl=l=>l==='OVER'?{bg:'rgba(220,38,38,.07)',bc:'rgba(220,38,38,.2)',dot:'#DC2626',tx:'#991B1B'}:l==='HIGH'?{bg:'rgba(245,158,11,.08)',bc:'rgba(245,158,11,.25)',dot:'#D97706',tx:'#92400E'}:l==='GAP'?{bg:'var(--g100)',bc:'var(--g200)',dot:'var(--g400)',tx:'var(--g500)'}:{bg:'rgba(20,165,88,.07)',bc:'rgba(20,165,88,.22)',dot:'#16A34A',tx:'#15803D'};
  const _capChips=CAP_DATA.channels.map(c=>{const cl=_tcCl(c.load);const nP=Math.max(1,c.people.length);const wk=c.hours/(40*nP);const wkTxt=wk<=0?'—':wk<0.2?'<1d':wk<0.5?Math.round(wk*5)+'d':wk.toFixed(1)+'wk';return'<div class="tw-cap-chip" style="background:'+cl.bg+';border-color:'+cl.bc+'" title="'+c.items+' active tasks · '+nP+' people · ~'+wkTxt+'/person to clear">'+'<span class="tw-cap-ch">'+(_tcSh[c.ch]||c.ch)+'</span>'+'<span class="tw-cap-items" style="color:'+cl.dot+'">'+c.items+'</span>'+'<span class="tw-cap-badge" style="background:'+cl.dot+'20;color:'+cl.tx+'">~'+wkTxt+'</span>'+'</div>';}).join('');
  const capStripHtml='<div class="tw-cap-strip">'+'<div class="tw-cap-hd">Team Capacity <span class="tw-cap-as">'+CAP_DATA.pulledAt+' · active tasks only · 40h/wk assumed</span></div>'+'<div class="tw-cap-row">'+_capChips+'</div>'+'<div class="tw-cap-summary">'+'<span style="color:#DC2626;font-weight:700">'+CAP_DATA.channels.filter(c=>c.load==='OVER').length+' full queue</span>'+' · '+CAP_DATA.channels.filter(c=>c.load==='HIGH').length+' high load'+' · '+CAP_DATA.channels.filter(c=>c.load==='OK').length+' healthy'+' · '+CAP_DATA.channels.filter(c=>c.load==='LIGHT').length+' light'+'</div>'+'</div>';
  document.getElementById('teams').innerHTML=
    '<div class="sec-hd"><h2>Teams Dashboard</h2><p>Updated '+CAP_DATA.pulledAt+'</p></div>'
    +capStripHtml
    +noDataBanner
    +'<div class="tw-grid">'+_expandChannels(CAP_DATA.channels).map(_card).join('')+'</div>';
}

/* ══════════════════════════════════════════════════════
   WORKSTREAMS HELPERS (used by Deliverables channel view)
══════════════════════════════════════════════════════ */
const _wsExpanded={};
function wsToggle(ch){
  _wsExpanded[ch]=!_wsExpanded[ch];
  // browser stores data attributes decoded, so query with unencoded value
  const card=document.querySelector('.ws-card[data-ch="'+ch.replace(/\\/g,'\\\\').replace(/"/g,'\\"')+'"]');
  if(card)card.classList.toggle('open',!!_wsExpanded[ch]);
}
function wsShowMore(safeId){
  const list=document.getElementById('ws-more-'+safeId);
  const btn =document.getElementById('ws-mbtn-'+safeId);
  if(list)list.style.display='';
  if(btn)btn.remove();
}
/* renderWorkstreams removed — channel view now lives inside renderDeliverables */

   BOOT
══════════════════════════════════════════════════════ */
document.getElementById('upd-badge').textContent = DATA.lastUpdated;
renderBriefing();
