<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Marketing Ownership Map — RACI</title>
<style>
  .viz-root {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --surface-2: #f5f5f5;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --eden: #10503c;
    --eden-800: #082521;
    --lochinvar: #2c9382;
    --flamingo: #f23e30;
    --gin: #e6eeeb;
    --wildsand: #f5f5f5;
    --dune: #363432;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--surface-1);
    color: var(--text-primary);
    padding: 24px;
  }
  .viz-root h1 { font-size: 20px; margin: 0 0 4px; color: var(--eden-800); }
  .viz-root .subtitle { color: var(--text-secondary); font-size: 13px; margin-bottom: 16px; }
  .tabstrip { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 2px solid var(--grid); }
  .tabbtn { padding: 8px 16px; border: none; background: none; cursor: pointer; font-size: 14px; color: var(--text-secondary); border-bottom: 3px solid transparent; }
  .tabbtn.active { color: var(--eden-800); border-bottom-color: var(--eden); font-weight: 600; }
  .tabpanel { display: none; }
  .tabpanel.active { display: block; }
  .legend { display: flex; gap: 16px; font-size: 12px; color: var(--text-secondary); margin-bottom: 12px; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .swatch { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
  table.matrix { border-collapse: collapse; width: 100%; font-size: 12px; }
  table.matrix th, table.matrix td { border: 1px solid var(--grid); padding: 0; text-align: center; vertical-align: middle; }
  table.matrix th { background: var(--eden-800); color: white; padding: 8px 6px; font-weight: 600; font-size: 11px; }
  table.matrix th.teamcol { text-align: left; padding-left: 10px; }
  table.matrix td.teamcell { text-align: left; padding: 8px 10px; font-weight: 600; background: var(--surface-2); white-space: nowrap; }
  tr.groupheader td { background: var(--dune); color: white; font-weight: 700; font-size: 11px; padding: 5px 10px; text-transform: uppercase; letter-spacing: 0.03em; }
  .racell { width: 100%; height: 100%; min-height: 40px; border: none; cursor: pointer; font-weight: 700; font-size: 13px; padding: 8px 4px; position: relative; }
  .racell.r { background: var(--eden); color: white; }
  .racell.a { background: var(--lochinvar); color: white; }
  .racell.c { background: var(--gin); color: var(--dune); }
  .racell.i { background: var(--wildsand); color: var(--muted); }
  .racell.q { background: var(--wildsand); color: var(--muted); font-style: italic; }
  .racell.conflict { box-shadow: inset 0 0 0 3px var(--flamingo); }
  #tooltip { position: fixed; max-width: 280px; background: var(--dune); color: white; font-size: 12px; padding: 10px 12px; border-radius: 6px; pointer-events: none; z-index: 999; display: none; line-height: 1.4; }
  #tooltip .conflict-line { color: #ffb3ad; margin-top: 6px; font-weight: 600; }
  .flow-wrap { overflow-x: auto; }
  .flow-grid { display: grid; grid-template-columns: 160px repeat(8, 150px); gap: 6px; min-width: 1400px; }
  .flow-stage-header { background: var(--eden-800); color: white; font-size: 11px; font-weight: 600; padding: 8px 6px; text-align: center; border-radius: 4px; }
  .flow-group-label { background: var(--dune); color: white; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; padding: 8px; border-radius: 4px; display: flex; align-items: center; }
  .flow-team-label { background: var(--surface-2); font-size: 12px; font-weight: 600; padding: 8px; border-radius: 4px; display: flex; align-items: center; }
  .flow-node { border-radius: 5px; padding: 8px 6px; font-size: 12px; font-weight: 700; text-align: center; cursor: pointer; position: relative; }
  .flow-node.r { background: var(--eden); color: white; }
  .flow-node.a { background: var(--lochinvar); color: white; }
  .flow-node.c { background: var(--gin); color: var(--dune); }
  .flow-node.i { background: var(--wildsand); color: var(--muted); }
  .flow-node.q { background: var(--wildsand); color: var(--muted); font-style: italic; }
  .flow-node.conflict { box-shadow: inset 0 0 0 3px var(--flamingo); }
  .flow-arrow-row { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 16px; }
  .missing-who { color: var(--flamingo); font-size: 10px; font-style: italic; }
</style>
</head>

const TAG_LABEL = {r:"R", a:"A", c:"C", i:"I", q:"?"};

function buildMatrix() {
  const root = document.getElementById('matrixView');
  let html = '<table class="matrix"><thead><tr><th class="teamcol">Team</th>';
  STAGES.forEach((s,i) => html += `<th>${i+1}. ${s}</th>`);
  html += '</tr></thead><tbody>';
  GROUPS.forEach(group => {
    html += `<tr class="groupheader"><td colspan="${STAGES.length+1}">${group.name.toUpperCase()}</td></tr>`;
    group.rows.forEach(row => {
      html += `<tr><td class="teamcell">${row.label}${row.who ? '' : ' <span class="missing-who">(who: TBD)</span>'}</td>`;
      row.cells.forEach((cell, idx) => {
        const cls = `racell ${cell.t}${cell.conflict ? ' conflict' : ''}`;
        html += `<td><button class="${cls}" data-team="${row.label}" data-stage="${STAGES[idx]}" data-note="${escapeAttr(cell.note||'')}" data-conflictnote="${escapeAttr(cell.conflictNote||'')}">${TAG_LABEL[cell.t]}</button></td>`;
      });
      html += '</tr>';
    });
  });
  html += '</tbody></table>';
  root.innerHTML = html;
}

function buildFlow() {
  const grid = document.getElementById('flowGrid');
  let html = '<div class="flow-group-label" style="visibility:hidden">Team</div>';
  STAGES.forEach((s,i) => html += `<div class="flow-stage-header">${i+1}. ${s}</div>`);

  GROUPS.forEach(group => {
    html += `<div class="flow-group-label" style="grid-column: 1 / span 1;">${group.name}</div>`;
    for (let i = 0; i < STAGES.length; i++) html += '<div></div>';

    group.rows.forEach(row => {
      html += `<div class="flow-team-label">${row.label}</div>`;
      row.cells.forEach((cell, idx) => {
        const cls = `flow-node ${cell.t}${cell.conflict ? ' conflict' : ''}`;
        html += `<div class="${cls}" data-team="${row.label}" data-stage="${STAGES[idx]}" data-note="${escapeAttr(cell.note||'')}" data-conflictnote="${escapeAttr(cell.conflictNote||'')}">${TAG_LABEL[cell.t]}</div>`;
      });
    });
  });
  grid.innerHTML = html;
}

function escapeAttr(s) { return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }

const tooltip = document.getElementById('tooltip');
function showTip(el) {
  const team = el.getAttribute('data-team');
  const stage = el.getAttribute('data-stage');
  const note = el.getAttribute('data-note');
  const conflictNote = el.getAttribute('data-conflictnote');
  let html = `<strong>${team}</strong> — ${stage}`;
  if (note) html += `<div style="margin-top:4px;">${note}</div>`;
  if (conflictNote) html += `<div class="conflict-line">⚠ ${conflictNote}</div>`;
  tooltip.innerHTML = html;
  tooltip.style.display = 'block';
}
function positionTip(evt) {
  tooltip.style.left = Math.min(evt.clientX + 14, window.innerWidth - 300) + 'px';
  tooltip.style.top = Math.min(evt.clientY + 14, window.innerHeight - 100) + 'px';
}
function hideTip() { tooltip.style.display = 'none'; }

document.addEventListener('mouseover', e => {
  const el = e.target.closest('.racell, .flow-node');
  if (el) showTip(el);
});
document.addEventListener('mousemove', e => {
  if (tooltip.style.display === 'block') positionTip(e);
});
document.addEventListener('mouseout', e => {
  const el = e.target.closest('.racell, .flow-node');
  if (el) hideTip();
});

document.querySelectorAll('.tabbtn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tabbtn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tabpanel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.add('active');
  });
});
